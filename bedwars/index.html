<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1a1c24">
<title>床戰 BED WARS</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="c"></canvas>

<!-- 遊戲畫面 HUD -->
<div id="hud" class="hidden">
  <div id="crosshair">+</div>
  <div id="hurt"></div>
  <div id="scoreboard"></div>
  <div id="feed"></div>
  <div id="titles"><div id="bigTitle"></div><div id="subTitle"></div></div>
  <div id="respawn"></div>
  <div id="toast"></div>
  <div id="breakbar"><div id="breakfill"></div></div>
  <div id="res"></div>
  <div id="bottom">
    <div id="itemName"></div>
    <div id="hearts"></div>
    <div id="hotbar"></div>
  </div>
</div>

<!-- 手機觸控 -->
<div id="touch" class="hidden">
  <div id="joyBase"><div id="joyKnob"></div></div>
  <div id="ttop">
    <button id="tShop">商店</button><button id="tMate">隊友</button><button id="tEat">金蘋果</button><button id="tPause">❚❚</button>
  </div>
  <button id="tAtk" class="tb">⚔<span>攻擊</span></button>
  <button id="tUse" class="tb">▣<span>放置</span></button>
  <button id="tJump" class="tb">跳</button>
  <button id="tSneak" class="tb">蹲</button>
</div>
<div id="rotate">請把手機轉成橫向 ↻</div>

<!-- 主選單 -->
<div id="menu">
  <div class="panel">
    <h1>床戰 <span>BED WARS</span></h1>
    <p class="sub">單人模式：4 隊 × 2 人 — 你和電腦隊友 vs 3 隊電腦</p>
    <label>玩家名稱 <input id="pname" maxlength="10" value="玩家"></label>
    <div class="row">
      <button class="diff" data-d="easy">簡單</button>
      <button class="diff on" data-d="normal">普通</button>
      <button class="diff" data-d="hard">困難</button>
    </div>
    <button id="startBtn" class="big">開始遊戲</button>
    <div class="help">
      <div><b>WASD</b> 移動（往前自動衝刺）</div><div><b>滑鼠</b> 看方向</div>
      <div><b>空白鍵</b> 跳</div><div><b>Shift</b> 蹲下（不會掉下邊緣，搭橋用）</div>
      <div><b>左鍵</b> 攻擊／按住挖方塊</div><div><b>右鍵</b> 放方塊／使用道具（按住連放）</div>
      <div style="grid-column:span 2"><b>基岩版搭橋</b>：拿著方塊對著前方空中按住右鍵往前走，方塊會自動放在腳下前方（白框預覽），不用蹲</div>
      <div><b>1–9 / 滾輪</b> 切換物品</div><div><b>E</b> 開商店（站在 NPC 旁）</div>
      <div><b>G</b> 切換隊友指令</div><div><b>F</b> 吃金蘋果（手持時）</div>
    </div>
    <p class="tip">規則：床還在就能重生。拆掉敵人的床，再把他們全部擊殺就能獲勝！</p>
  </div>
</div>

<!-- 暫停 -->
<div id="pause" class="hidden">
  <div class="panel">
    <h2>遊戲暫停</h2>
    <button id="resumeBtn" class="big">繼續遊戲</button>
    <label>滑鼠靈敏度 <input id="sens" type="range" min="1" max="60" value="27"></label>
    <label>音量 <input id="vol" type="range" min="0" max="100" value="50"></label>
    <button id="quitBtn">回主選單</button>
  </div>
</div>

<!-- 商店 -->
<div id="shop" class="hidden"><div id="shopBox"></div></div>

<!-- 結算 -->
<div id="end" class="hidden">
  <div class="panel">
    <h1 id="endTitle"></h1>
    <div id="endStats"></div>
    <div class="row">
      <button id="againBtn" class="big">再玩一次</button>
      <button id="menuBtn">回主選單</button>
    </div>
  </div>
</div>

<script src="js/three.min.js"></script>
<script src="js/world.js"></script>
<script src="js/entities.js"></script>
<script src="js/ai.js"></script>
<script src="js/game.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
