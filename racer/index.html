<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>極速狂飆 X</title>
<link rel="icon" href="../icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#05060f;color:#fff;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;user-select:none;-webkit-user-select:none;touch-action:none}
canvas{display:block}
#gl{position:fixed;inset:0;z-index:0}
#fx{position:fixed;inset:0;z-index:1;pointer-events:none}
#vign{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:0;transition:opacity .25s;box-shadow:inset 0 0 160px 40px rgba(60,170,255,.75)}
.hidden{display:none!important}
.num{font-family:Orbitron,system-ui,sans-serif}
/* ---------- UI screens ---------- */
#ui{position:fixed;inset:0;z-index:5;pointer-events:none}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;pointer-events:auto;padding:20px}
.dim{background:rgba(3,5,18,.72);backdrop-filter:blur(4px)}
.logo{font-size:clamp(40px,9vw,92px);font-weight:900;letter-spacing:4px;font-style:italic;background:linear-gradient(180deg,#fff 20%,#7fd8ff 60%,#2a6cff);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 40px rgba(60,160,255,.35);line-height:1}
.logo span{background:linear-gradient(180deg,#ffd54a,#ff5a1f);-webkit-background-clip:text;background-clip:text;color:transparent;margin-left:8px}
.sub{letter-spacing:8px;color:#9fc6ff;font-size:13px;margin-bottom:14px}
.btn{pointer-events:auto;border:none;cursor:pointer;color:#fff;font-weight:900;font-size:18px;padding:12px 30px;min-width:200px;border-radius:4px;transform:skewX(-12deg);background:linear-gradient(90deg,#1b2a55,#22407e);box-shadow:0 0 0 2px rgba(120,190,255,.35) inset;transition:transform .1s,filter .1s;font-family:inherit}
.btn>span{display:inline-block;transform:skewX(12deg)}
.btn:hover{filter:brightness(1.25)}
.btn:active{transform:skewX(-12deg) scale(.96)}
.btn.big{font-size:24px;padding:16px 46px;background:linear-gradient(90deg,#ff4d1f,#ffb21f);box-shadow:0 0 30px rgba(255,120,30,.45)}
.btn.small{min-width:120px;font-size:16px;padding:10px 20px}
.btn:disabled{filter:grayscale(1) brightness(.6);cursor:default}
#backLink{position:absolute;top:14px;left:18px;pointer-events:auto;color:#9fc6ff;text-decoration:none;font-weight:900;font-size:15px;text-shadow:0 2px 6px #000}
#topbar{position:absolute;top:14px;right:18px;font-size:18px;font-weight:900;color:#ffd54a;pointer-events:none;text-shadow:0 2px 6px #000}
.help{margin-top:16px;max-width:620px;font-size:13px;line-height:1.8;color:#b8c8e8;text-align:center;background:rgba(0,0,0,.35);padding:10px 16px;border-radius:8px}
.help b{color:#ffd54a}
.panelBottom{justify-content:flex-end;padding-bottom:26px}
.card{background:rgba(8,14,36,.82);border:1px solid rgba(120,180,255,.3);border-radius:10px;padding:16px 20px;width:min(560px,94vw)}
.gHead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.nav{pointer-events:auto;width:52px;height:52px;border-radius:50%;border:2px solid rgba(140,200,255,.5);background:rgba(20,40,90,.7);color:#fff;font-size:22px;cursor:pointer}
#gName{font-size:28px;font-weight:900;text-align:center;font-style:italic}
#gClass{text-align:center;color:#9fc6ff;font-size:13px;letter-spacing:2px}
.stat{display:flex;align-items:center;gap:10px;margin-top:8px;font-size:14px}
.stat label{width:52px;color:#9fc6ff}
.stat .bar{flex:1;height:9px;background:rgba(255,255,255,.1);border-radius:5px;overflow:hidden}
.stat .bar i{display:block;height:100%;background:linear-gradient(90deg,#2a8cff,#7fe0ff);border-radius:5px}
.stat .v{width:72px;text-align:right;font-family:Orbitron,sans-serif;font-size:12px}
.row{display:flex;gap:14px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.tracks{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.tcard{pointer-events:auto;cursor:pointer;width:200px;height:130px;border-radius:10px;padding:14px;display:flex;flex-direction:column;justify-content:flex-end;border:2px solid rgba(255,255,255,.2);transition:transform .12s,border-color .12s;position:relative;overflow:hidden}
.tcard:hover{transform:translateY(-4px);border-color:#ffd54a}
.tcard h3{font-size:22px;font-style:italic;text-shadow:0 2px 6px #000}
.tcard p{font-size:12px;color:#eef;text-shadow:0 1px 4px #000}
.title2{font-size:30px;font-weight:900;font-style:italic;margin-bottom:6px}
.opt{display:flex;align-items:center;justify-content:space-between;gap:20px;margin:10px 0;font-size:16px}
.tog{pointer-events:auto;border:none;border-radius:20px;padding:8px 18px;font-weight:900;cursor:pointer;background:#22407e;color:#fff;min-width:90px;font-family:inherit}
.tog.on{background:#1fbf6a}
#resRank{font-size:84px;font-weight:900;font-style:italic;line-height:1}
#resList{width:100%;margin-top:8px;font-size:14px}
#resList div{display:flex;justify-content:space-between;padding:4px 8px;border-bottom:1px solid rgba(255,255,255,.08)}
#resList div.me{background:rgba(255,180,30,.2);color:#ffd54a;font-weight:900}
.kv{display:flex;justify-content:space-between;font-size:15px;margin:3px 0}
.kv b{font-family:Orbitron,sans-serif;color:#7fe0ff}
/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;z-index:3;pointer-events:none}
#hTL{position:absolute;top:12px;left:16px;text-shadow:0 2px 6px rgba(0,0,0,.8)}
#hPos{font-size:56px;font-weight:900;font-style:italic;line-height:1}
#hPos small{font-size:24px;color:#9fc6ff}
#hLap{font-size:16px;font-weight:900;margin-top:4px}
#hTime{font-size:16px;color:#ffd54a;margin-top:2px}
#mini{position:absolute;top:10px;right:12px;width:140px;height:140px;opacity:.9}
#bPause{position:absolute;top:12px;left:50%;transform:translateX(-50%);pointer-events:auto;width:46px;height:46px;border-radius:50%;border:2px solid rgba(255,255,255,.4);background:rgba(0,0,0,.4);color:#fff;font-weight:900;font-size:16px;cursor:pointer}
#hBottom{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);width:min(380px,46vw);text-align:center}
#hSpeed{font-style:italic;text-shadow:0 2px 8px rgba(0,0,0,.8);line-height:1}
#spd{font-size:54px;font-weight:900}
#hSpeed small{font-size:14px;margin-left:4px;color:#9fc6ff}
#nitroWrap{position:relative;height:16px;margin-top:6px;transform:skewX(-20deg);background:rgba(0,0,0,.55);border:2px solid rgba(120,200,255,.6);overflow:hidden}
#nitroFill{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,#1a7dff,#5fe3ff)}
#nitroWrap .seg{position:absolute;inset:0;background:linear-gradient(90deg,transparent 33%,rgba(0,0,0,.8) 33%,rgba(0,0,0,.8) 33.6%,transparent 33.6%,transparent 66.4%,rgba(0,0,0,.8) 66.4%,rgba(0,0,0,.8) 67%,transparent 67%)}
#burstWrap{position:relative;height:6px;margin:5px auto 0;width:70%;background:rgba(0,0,0,.5);transform:skewX(-20deg);opacity:0;transition:opacity .15s}
#burstZone{position:absolute;left:0;top:-2px;bottom:-2px;background:rgba(200,120,255,.55);box-shadow:0 0 8px #c77dff}
#burstFill{position:absolute;left:0;top:0;bottom:0;background:#fff}
#nitroTip{font-size:11px;color:#9fc6ff;margin-top:4px;height:14px}
#pops{position:absolute;top:24%;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:4px}
.pop{font-size:clamp(22px,4vw,36px);font-weight:900;font-style:italic;text-shadow:0 0 14px currentColor,0 3px 6px #000;animation:pop 1.3s ease-out forwards;white-space:nowrap}
@keyframes pop{0%{transform:scale(1.8);opacity:0}12%{transform:scale(1);opacity:1}75%{opacity:1}100%{transform:translateY(-30px);opacity:0}}
#count{position:fixed;inset:0;z-index:4;display:flex;align-items:center;justify-content:center;pointer-events:none;font-size:clamp(90px,20vw,200px);font-weight:900;font-style:italic;text-shadow:0 0 40px rgba(255,160,40,.8),0 6px 10px #000}
#count.go{color:#5fff9a;text-shadow:0 0 40px rgba(60,255,140,.8),0 6px 10px #000}
#rotHint{position:fixed;bottom:40%;left:0;right:0;text-align:center;z-index:4;font-size:14px;color:#ffd54a;pointer-events:none;text-shadow:0 2px 4px #000}
/* ---------- touch ---------- */
#touch{position:fixed;inset:0;z-index:4;pointer-events:none}
#touch button{pointer-events:auto;position:absolute;bottom:22px;width:clamp(70px,13vw,104px);height:clamp(70px,13vw,104px);border-radius:50%;border:3px solid rgba(255,255,255,.45);background:rgba(10,20,50,.45);color:#fff;font-size:clamp(18px,3.4vw,26px);font-weight:900;font-family:inherit;touch-action:none}
#touch button.on{background:rgba(80,170,255,.6);border-color:#fff}
#tL{left:20px}#tR{left:calc(36px + clamp(70px,13vw,104px))}
#tN{right:20px;background:rgba(20,110,255,.55)!important;bottom:calc(30px + clamp(70px,13vw,104px))!important}
#tB{right:20px}
@media (max-height:500px){#hPos{font-size:40px}#spd{font-size:40px}#mini{width:100px;height:100px}}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div id="vign"></div>

<div id="hud" class="hidden">
  <div id="hTL"><div id="hPos" class="num">8<small>/8</small></div><div id="hLap">圈數 1/3</div><div id="hTime" class="num">00:00.00</div></div>
  <canvas id="mini" width="280" height="280"></canvas>
  <button id="bPause">II</button>
  <div id="hBottom">
    <div id="hSpeed"><span id="spd" class="num">0</span><small>km/h</small></div>
    <div id="nitroWrap"><div id="nitroFill"></div><div class="seg"></div></div>
    <div id="burstWrap"><div id="burstZone"></div><div id="burstFill"></div></div>
    <div id="nitroTip"></div>
  </div>
  <div id="pops"></div>
</div>
<div id="count"></div>
<div id="rotHint" class="hidden">📱 建議將手機轉成橫向遊玩</div>

<div id="touch" class="hidden">
  <button id="tL" data-k="left">◀</button>
  <button id="tR" data-k="right">▶</button>
  <button id="tN" data-k="nitro">氮氣</button>
  <button id="tB" data-k="brake">甩尾</button>
</div>

<div id="ui">
  <a id="backLink" href="../games/">← 遊戲大廳</a>
  <div id="topbar">💰 <span id="credits" class="num">0</span></div>

  <div id="scrMain" class="scr">
    <div class="logo">極速狂飆<span>X</span></div>
    <div class="sub">ARCADE STREET RACING</div>
    <button class="btn big" id="bPlay"><span>開始比賽</span></button>
    <button class="btn" id="bGarage"><span>車庫</span></button>
    <button class="btn" id="bSet"><span>設定</span></button>
    <div class="help">
      自動油門！專心轉向、甩尾和噴氮氣。<br>
      <b>電腦</b>：← → / A D 轉向　↓ / S 甩尾（轉彎中按住）　↑ / W / 空白鍵 氮氣　P 暫停<br>
      <b>氮氣技巧</b>：氮氣快用完時（紫色區）再按一次＝<b>完美氮氣</b>；氮氣滿格時快速連按兩下＝<b>衝擊波</b><br>
      甩尾、飛躍、桶滾跳台、擦身超車、撞毀對手（Takedown）都能集氮氣　|　<b>手機</b>：畫面按鈕操作
    </div>
  </div>

  <div id="scrGarage" class="scr panelBottom hidden">
    <div class="card">
      <div class="gHead"><button class="nav" id="gPrev">◀</button><div><div id="gName"></div><div id="gClass"></div></div><button class="nav" id="gNext">▶</button></div>
      <div id="gStats"></div>
      <div class="row"><button class="btn small" id="gBack"><span>返回</span></button><button class="btn big" id="gAct"><span>選擇</span></button></div>
    </div>
  </div>

  <div id="scrTrack" class="scr dim hidden">
    <div class="title2">選擇賽道</div>
    <div id="tSel" style="color:#9fc6ff;font-size:14px;margin-bottom:6px"></div>
    <div class="tracks" id="tracks"></div>
    <div class="row"><button class="btn small" id="tBack"><span>返回</span></button></div>
  </div>

  <div id="scrSet" class="scr dim hidden">
    <div class="card">
      <div class="title2">設定</div>
      <div class="opt"><span>畫質（低畫質適合手機）</span><button class="tog" id="oQ"></button></div>
      <div class="opt"><span>音效</span><button class="tog" id="oS"></button></div>
      <div class="opt"><span>顯示觸控按鈕</span><button class="tog" id="oT"></button></div>
      <div class="row"><button class="btn small" id="sBack"><span>返回</span></button></div>
    </div>
  </div>

  <div id="scrPause" class="scr dim hidden">
    <div class="title2">暫停</div>
    <button class="btn big" id="pResume"><span>繼續</span></button>
    <button class="btn" id="pRestart"><span>重新開始</span></button>
    <button class="btn" id="pQuit"><span>回主選單</span></button>
  </div>

  <div id="scrResult" class="scr dim hidden">
    <div class="card" style="text-align:center">
      <div id="resTitle" style="font-size:18px;color:#9fc6ff;letter-spacing:4px">比賽結果</div>
      <div id="resRank" class="num">1</div>
      <div id="resStats" style="text-align:left;margin-top:8px"></div>
      <div id="resList"></div>
      <div class="row"><button class="btn small" id="rMenu"><span>主選單</span></button><button class="btn big" id="rAgain"><span>再來一場</span></button></div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
const $ = id => document.getElementById(id);
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const TAU = Math.PI * 2;
function wrapA(a){ while(a > Math.PI) a -= TAU; while(a < -Math.PI) a += TAU; return a; }
function rng(seed){ let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

// ================= SAVE =================
const save = { credits: 1500, owned: [0], car: 0, quality: 'high', sound: true, touch: null };
try { const s = JSON.parse(localStorage.getItem('jskx_save') || 'null'); if (s) Object.assign(save, s); } catch (e) {}
function persist(){ try { localStorage.setItem('jskx_save', JSON.stringify(save)); } catch (e) {} }
const IS_TOUCH = ('ontouchstart' in window) || (window.matchMedia && matchMedia('(pointer:coarse)').matches);
if (save.touch === null) save.touch = IS_TOUCH;

// ================= DATA =================
const CARS = [
  { name: '疾風 GT',   cls: 'D 級', color: 0x2f8cff, vmax: 74, acc: 19, hand: 1.55, nitro: 1.00, price: 0,     shape: { L: 4.3, W: 1.85, wing: 0 } },
  { name: '赤焰 RS',   cls: 'C 級', color: 0xff3b30, vmax: 80, acc: 22, hand: 1.65, nitro: 1.05, price: 2500,  shape: { L: 4.4, W: 1.9,  wing: 1 } },
  { name: '黃金獵豹',  cls: 'B 級', color: 0xffc400, vmax: 86, acc: 25, hand: 1.72, nitro: 1.10, price: 6000,  shape: { L: 4.5, W: 1.95, wing: 1 } },
  { name: '暗影幽靈',  cls: 'A 級', color: 0x8a3cff, vmax: 92, acc: 28, hand: 1.82, nitro: 1.15, price: 12000, shape: { L: 4.6, W: 2.0,  wing: 2 } },
  { name: '雷霆極光',  cls: 'S 級', color: 0x00e0b0, vmax: 99, acc: 32, hand: 1.95, nitro: 1.22, price: 22000, shape: { L: 4.7, W: 2.05, wing: 2 } },
];
const TRACKS = [
  { name: '霓虹都市', desc: '夜晚城市・高樓霓虹', theme: 'city', seed: 3, R: 520, sx: 1.3, elev: [5, 3],
    sky: 0x070b22, fog: 0x10173a, fogFar: 750, ground: 0x15171f, road: '#26282f', wall: 0x2c3148, neon: 0x00e5ff, grad: 'linear-gradient(135deg,#1b1060,#ff2fa0)' },
  { name: '沙漠峽谷', desc: '烈日黃沙・大落差飛躍', theme: 'desert', seed: 7, R: 560, sx: 1.15, elev: [14, 8],
    sky: 0xf0b47a, fog: 0xebb582, fogFar: 1150, ground: 0xd29a58, road: '#46423e', wall: 0xa85c22, neon: 0xff8a00, grad: 'linear-gradient(135deg,#c2621d,#ffd27a)' },
  { name: '冰雪山道', desc: '雪地松林・連續彎道', theme: 'snow', seed: 11, R: 480, sx: 1.0, elev: [11, 6],
    sky: 0x9cc8f0, fog: 0xd8e6f4, fogFar: 950, ground: 0xeef4fa, road: '#3a3e45', wall: 0x5f80a6, neon: 0x4fc3ff, grad: 'linear-gradient(135deg,#3f7fc4,#e6f3ff)' },
];
const AI_NAMES = ['閃電', '夜梟', '烈風', '狂豹', '銀狼', '火鳥', '幻影'];
const AI_COLORS = [0xff3b30, 0xffcc00, 0x34c759, 0xaf52de, 0xff9500, 0xf2f2f2, 0x5ac8fa, 0x333333, 0xff2d75];
const HALF = 12, LAPS = 3, G = 32, LANES = [-9, -3, 3, 9];
const NBURST = 2.2, PERF_WIN = 0.6;

// ================= RENDERER =================
const renderer = new THREE.WebGLRenderer({ antialias: save.quality === 'high', powerPreference: 'high-performance' });
renderer.domElement.id = 'gl';
document.body.prepend(renderer.domElement);
function applyPR(){ renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, save.quality === 'high' ? 1.75 : 1)); }
applyPR();
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(70, 1, 0.3, 5000);
const fx = $('fx'), fxc = fx.getContext('2d');
function resize(){
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h);
  camera.aspect = w / h; camera.updateProjectionMatrix();
  show.cam.aspect = w / h; show.cam.updateProjectionMatrix();
  fx.width = w; fx.height = h;
}

// ---------- shared textures ----------
function canvasTex(w, h, draw, repeat){ const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h); const t = new THREE.CanvasTexture(c); if (repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; } t.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy()); return t; }
const glowTex = canvasTex(64, 64, (g) => { const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32); gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.4, 'rgba(255,255,255,.5)'); gr.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = gr; g.fillRect(0, 0, 64, 64); });
const shadowTex = canvasTex(64, 128, (g) => { const gr = g.createRadialGradient(32, 64, 4, 32, 64, 60); gr.addColorStop(0, 'rgba(0,0,0,.75)'); gr.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = gr; g.fillRect(0, 0, 64, 128); });

// ================= CAR MODEL =================
function makeCar(color, shape){
  const g = new THREE.Group();
  const body = new THREE.Group(); g.add(body);
  const paint = new THREE.MeshPhongMaterial({ color, shininess: 100, specular: 0x777777 });
  const glass = new THREE.MeshPhongMaterial({ color: 0x0c1018, shininess: 140, specular: 0x99aabb });
  const black = new THREE.MeshLambertMaterial({ color: 0x0b0b0d });
  const silver = new THREE.MeshPhongMaterial({ color: 0xc8ccd4, shininess: 80 });
  const L = shape.L, W = shape.W;
  const add = (geo, mat, x, y, z, rx) => { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); if (rx) m.rotation.x = rx; body.add(m); return m; };
  add(new THREE.BoxGeometry(W, 0.42, L), paint, 0, 0.5, 0);
  add(new THREE.BoxGeometry(W * 0.97, 0.22, L * 0.36), paint, 0, 0.76, L * 0.28, 0.13);
  add(new THREE.BoxGeometry(W * 0.98, 0.22, L * 0.24), paint, 0, 0.76, -L * 0.36, -0.06);
  add(new THREE.BoxGeometry(W * 0.8, 0.44, L * 0.38), glass, 0, 0.92, -L * 0.04);
  add(new THREE.BoxGeometry(W * 0.76, 0.07, L * 0.27), paint, 0, 1.15, -L * 0.06);
  add(new THREE.BoxGeometry(0.34, 0.02, L * 0.27), new THREE.MeshBasicMaterial({ color: 0xffffff }), 0, 1.19, -L * 0.06);

function genTrack(def){

  const a = [0.15 + R() * 0.06, 0.08 + R() * 0.05, 0.035 + R() * 0.025];

  if (!P.startDone && raceT < 0.35) { perfectStart(); return; }
  if (P.nitroLvl === 0) {
    if (P.nitro < 12) { popup('氮氣不足', '#8fa6c8'); return; }

// ---------- player ----------
function updatePlayer(dt){

  if (c.wreck > 0) {

    c.vy -= G * dt; c.y += c.vy * dt; if (c.y < 0) { c.y = 0; c.vy = Math.abs(c.vy) * 0.35; if (c.vy < 2) c.vy = 0; }

  // speed
  const target = st.vmax * mult * (c.drifting ? 0.94 : 1);
  if (brake && !c.drifting) c.speed = Math.max(0, c.speed - 48 * dt);
  else if (c.speed < target) c.speed = Math.min(target, c.speed + st.acc * accM * Math.max(0.12, 1 - (c.speed / target) ** 2) * dt);

    if (Math.random() < 0.7) { tmpV.set(side * -1.0, 0.4, 0.5).applyQuaternion(c.mesh.quaternion).add(c.mesh.position); emit(tmpV.x, tmpV.y, tmpV.z, rand(-4, 4), rand(2, 6), rand(-4, 4), 0.35, 0.6, 0xffcc44, 0, 1, 20); }

    c.lap = lap; c.lapStart = raceT;
    if (lap < LAPS) { popup(lap === LAPS - 1 ? '最後一圈！' : '第 ' + (lap + 1) + ' 圈', '#ffd54a'); beep(660, 0.2, 'triangle', 0.2); }

function wreck(msg){

// ---------- AI ----------
function blockedAt(a, laneX, dmin, dmax){
  for (const o of CARSALL) {
    if (o === a || o.crash > 0 || o.wreck > 0) continue;

}
function updateAI(a, dt){

    a.vy -= G * dt; a.y += a.vy * dt; if (a.y < 0) { a.y = 0; a.vy = Math.abs(a.vy) * 0.35; if (a.vy < 2) a.vy = 0; }
    const air = a.y > 0 ? 1 : 0.25; a.rx += a.spin[0] * dt * air; a.ry += a.spin[1] * dt * air; a.rz += a.spin[2] * dt * air;
    if (Math.random() < 0.4) emit(a.mesh.position.x, a.mesh.position.y + 0.8, a.mesh.position.z, rand(-1, 1), rand(2, 4), rand(-1, 1), 1.1, 2, 0x2a2a2a, 3, 0.55);
    if (a.crash <= 0) { a.y = 0; a.vy = 0; a.rx = a.ry = a.rz = 0; a.speed = 30; a.lane = Math.floor(Math.random() * 4); a.x = a.tx = LANES[a.lane]; }
    return;
  }
  let tgt = a.vmax;
  if (!P.finished && P.wreck <= 0) {
    const gap = a.dist - P.dist;
    if (gap > 40) tgt *= 1 - Math.min(0.13, (gap - 40) / 1300); else if (gap < -30) tgt *= 1 + Math.min(0.15, (-gap - 30) / 900);
  }
  tgt *= 1 - Math.min(0.2, Math.abs(K[idx(a.dist + 45)]) * 26);
  if (a.nitroT > 0) { a.nitroT -= dt; tgt *= 1.22; } else if (Math.random() < dt * 0.06) a.nitroT = rand(1.2, 2.4);

  else a.speed -= (a.speed - tgt) * 1.4 * dt;
  // lanes
  a.laneT -= dt;
  const ahead = blockedAt(a, a.tx, 0, 18);
  if ((ahead && ahead.speed < a.speed + 2) || a.laneT <= 0) {
    const opts = [a.lane - 1, a.lane + 1].filter(l => l >= 0 && l < 4 && !blockedAt(a, LANES[l], -6, 22));
    if (opts.length) { a.lane = opts[Math.floor(Math.random() * opts.length)]; a.tx = LANES[a.lane]; }
    else if (ahead) a.speed = Math.min(a.speed, ahead.speed + 1);
    a.laneT = rand(3, 8);
  }
  const dx = a.tx - a.x, step = Math.sign(dx) * Math.min(Math.abs(dx), 6.5 * dt);
  a.x += step; a.dist += a.speed * dt;
  a.yawVis += (Math.atan2(step / Math.max(dt, 1e-4), Math.max(a.speed, 5)) - a.yawVis) * Math.min(1, dt * 8);
  a.nitroLvl = a.nitroT > 0 ? 1 : 0;

}
function takedown(a, shock){
  a.crash = 2.8; a.vy = rand(10, 15); a.y = Math.max(a.y, 0.3); a.spin = [rand(-7, 7), rand(-5, 5), rand(-9, 9)]; a.speed *= 0.65; a.nitroT = 0; a.onRamp = null; a.rolling = false;
  P.takedowns++; P.nitro = Math.min(100, P.nitro + 25);

  slowT = 0.55; shake = Math.max(shake, 0.9); boom(0.8, 2000);
  for (let i = 0; i < 18; i++) emit(a.mesh.position.x, a.mesh.position.y + 0.6, a.mesh.position.z, rand(-9, 9), rand(3, 11), rand(-9, 9), 0.5, 0.7, 0xffcc44, 0, 1, 20);
  for (let i = 0; i < 6; i++) emit(a.mesh.position.x, a.mesh.position.y + 0.6, a.mesh.position.z, rand(-3, 3), rand(1, 4), rand(-3, 3), 0.6, 3, 0xff7a20, 4, 0.8);
}

// ---------- collisions ----------
function collisions(dt){
  if (P.wreck <= 0) for (const a of AIS) {
    if (a.crash > 0) continue;
    const d = dW(a.dist, P.dist), dx = a.x - P.x;
    // near miss / overtake
    if (a.prevD > 0 && d <= 0 && Math.abs(dx) >= 2.1 && Math.abs(dx) < 4.2 && !P.finished) { P.nearMiss++; addNitro(9); popup('擦身超車！', '#7fe0ff'); }
    a.prevD = d;
    if (Math.abs(d) < 4.6 && Math.abs(dx) < 2.15 && Math.abs(a.y - P.y) < 1.6) {
      const pLat = P.speed * Math.sin(P.yaw), aLat = 0;
      if (P.nitroLvl === 3) { takedown(a, true); continue; }
      if (Math.abs(dx) > 1.25 && Math.sign(dx) * (pLat - aLat) > 5.5) { takedown(a); continue; }
      if (d > 1.5 && P.speed - a.speed > 9) { takedown(a); continue; }
      // bump
      if (Math.abs(dx) > 1.25) { const o = (2.15 - Math.abs(dx)) / 2, s = Math.sign(dx) || 1; P.x -= s * o; a.x += s * o; P.yaw *= 0.5; shake = Math.max(shake, 0.25); }
      else if (d > 0) { P.speed = Math.min(P.speed, a.speed - 1); P.dist = a.dist - 4.6; shake = Math.max(shake, 0.3); }
      else { a.speed = Math.min(a.speed, P.speed - 1); a.dist = P.dist - 4.6; }
      if (Math.random() < 0.5) boom(0.15, 3000);
    }
  }
  // AI vs AI
  for (let i = 0; i < AIS.length; i++) for (let j = i + 1; j < AIS.length; j++) {
    const a = AIS[i], b = AIS[j]; if (a.crash > 0 || b.crash > 0) continue;
    const d = dW(b.dist, a.dist), dx = b.x - a.x;
    if (Math.abs(d) < 4.5 && Math.abs(dx) < 2.1) {
      if (d > 0) { a.speed = Math.min(a.speed, b.speed - 1); a.dist = b.dist - 4.5; } else { b.speed = Math.min(b.speed, a.speed - 1); b.dist = a.dist - 4.5; }
    }
  }

    if (p.cd > 0) { p.cd -= dt; if (p.cd <= 0) p.mesh.visible = true; continue; }
    p.mesh.rotation.y += dt * 3;
    if (P.wreck <= 0 && Math.abs(dW(P.dist, p.s)) < 3 && Math.abs(P.x - p.x) < 2.2 && P.y < 2.5) {
      p.cd = 12; p.mesh.visible = false; P.nitro = Math.min(100, P.nitro + 30); popup('+氮氣', '#3fb0ff'); beep(990, 0.12, 'sine', 0.2);
    }
  }
}

// ---------- placement ----------
function placeCar(c){
  trackAt(c.dist, TA);
  const m = c.mesh, px = TA.x + TA.rx * c.x, pz = TA.z + TA.rz * c.x;
  m.position.set(px, TA.y + c.y, pz);
  if (c.crash > 0 || c.wreck > 0) m.rotation.set(c.rx, TA.h - c.yawVis + c.ry, c.rz, 'YXZ');
  else {
    let pitch = -Math.atan(TA.slope);
    if (c.onRamp) pitch -= Math.atan(c.onRamp.hgt / c.onRamp.len);
    else if (c.air) pitch = -Math.atan2(c.vy, Math.max(c.speed, 10)) * 0.6;
    const yv = c.isPlayer ? (c.yaw + c.driftVis) : c.yawVis;
    m.rotation.set(pitch, TA.h - yv, c.roll + (c.isPlayer ? -steerVal * 0.04 : 0), 'YXZ');
  }
  const ud = m.userData;
  c.wheelRot += c.speed * 0.016 / 0.38;
  for (const w of ud.wheels) { w.p.rotation.x = c.wheelRot; w.p.rotation.y = w.front && c.isPlayer ? -steerVal * 0.35 : 0; }
  const nl = c.nitroLvl;
  for (const f of ud.flames) { f.visible = nl > 0; if (nl) { const s = (nl === 3 ? 1.6 : nl === 2 ? 1.3 : 1) * (0.8 + Math.random() * 0.4); f.scale.set(s, s, s); } }
  if (nl) ud.fm.color.setHex(nl === 3 ? 0xffa020 : nl === 2 ? 0xc066ff : 0x55ccff);
  const sh = c.shadow; sh.position.set(px, TA.y + 0.06, pz); sh.rotation.set(-Math.PI / 2, TA.h - (c.isPlayer ? c.yaw + c.driftVis : c.yawVis), 0, 'YXZ');
  const so = clamp(1 - c.y / 8, 0, 1); sh.material.opacity = so; sh.visible = so > 0.05;
}

// ---------- camera ----------
function updateCamera(dt){
  const c = P, pos = c.mesh.position;
  trackAt(c.dist, TC);
  const H0 = TC.h - (c.wreck > 0 ? 0 : (c.yaw + c.driftVis) * 0.45);
  camH += wrapA(H0 - camH) * (1 - Math.exp(-5 * dt));
  const sp = clamp(c.speed / c.st.vmax, 0, 1.5);
  const back = 7.2 + sp * 1.6, up = 2.5 + sp * 0.4 - c.y * 0.35;
  tmpV.set(-Math.sin(camH) * back, Math.max(1.4, up), -Math.cos(camH) * back);
  camOff.lerp(tmpV, 1 - Math.exp(-(state === 'countdown' ? 1.6 : 7) * dt));
  camera.position.copy(pos).add(camOff);
  const minY = TC.y + 1.2; if (camera.position.y < minY) camera.position.y = minY;
  if (shake > 0) { camera.position.x += rand(-1, 1) * shake * 0.5; camera.position.y += rand(-1, 1) * shake * 0.35; camera.position.z += rand(-1, 1) * shake * 0.5; shake = Math.max(0, shake - dt * 2.2); }
  lookV.set(pos.x + Math.sin(camH) * 7, pos.y + 1.1, pos.z + Math.cos(camH) * 7);
  camera.lookAt(lookV);
  const fovT = 66 + clamp(sp, 0, 1.2) * 8 + (c.nitroLvl ? (c.nitroLvl === 3 ? 18 : 12) : 0);
  camera.fov += (fovT - camera.fov) * Math.min(1, dt * 4); camera.updateProjectionMatrix();
  if (snow) {
    snow.position.copy(camera.position); const a = snow.geometry.attributes.position;
    for (let i = 0; i < a.count; i++) { let y = a.getY(i) - dt * 6; let z = a.getZ(i) - dt * c.speed * 0.3 * Math.cos(camH); let x = a.getX(i) - dt * c.speed * 0.3 * Math.sin(camH); if (y < -5) y += 45; if (z < -60) z += 120; if (z > 60) z -= 120; if (x < -60) x += 120; if (x > 60) x -= 120; a.setXYZ(i, x, y, z); }
    a.needsUpdate = true;
  }
}

// ---------- HUD ----------
const hudCache = {};

function fmtT(t){ const m = Math.floor(t / 60), s = t - m * 60; return String(m).padStart(2, '0') + ':' + s.toFixed(2).padStart(5, '0'); }
function rankOf(c){ let r = 1; for (const o of CARSALL) if (o !== c && (o.fin && (!c.fin || o.fin < c.fin) || (!o.fin && !c.fin && o.dist > c.dist))) r++; return r; }
function updateHUD(){

  } else bw.style.opacity = 0;
  setText('nitroTip', P.nitroLvl === 0 && P.nitro >= 95 ? '氮氣滿格：連按兩下發動衝擊波！' : (P.nitroLvl && P.nitroLvl < 3 && P.nitroT < PERF_WIN ? '現在按！完美氮氣' : ''));

function popup(text, color){

function drawFX(){

    const an = Math.random() * TAU, r = R0 + Math.random() * R0 * 0.9, len = 40 + Math.random() * 160 * inten;
    fxc.strokeStyle = 'rgba(255,255,255,' + (0.08 + Math.random() * 0.3 * inten).toFixed(2) + ')';
    fxc.beginPath(); fxc.moveTo(cx + Math.cos(an) * r, cy + Math.sin(an) * r * 0.7); fxc.lineTo(cx + Math.cos(an) * (r + len), cy + Math.sin(an) * (r + len) * 0.7); fxc.stroke();

// ---------- race end ----------
function finishRace(){
  P.finished = true; P.fin = raceT; P.nitroLvl = 0; P.drifting = false;
  P.rank = rankOf(P);
  popup(P.rank === 1 ? '冠軍！🏆' : '完賽！第 ' + P.rank + ' 名', '#ffd54a');
  beep(523, 0.15, 'triangle', 0.25); setTimeout(() => beep(784, 0.3, 'triangle', 0.25), 160);
  state = 'finished'; finishT = 0;
}
function showResults(){
  const rewards = [3000, 2200, 1600, 1200, 900, 700, 500, 400];
  const reward = rewards[P.rank - 1] + P.takedowns * 150 + P.perfects * 50 + P.nearMiss * 30;
  save.credits += reward; persist(); updateCredits();
  $('resRank').innerHTML = P.rank + '<span style="font-size:30px">/8</span>';
  $('resRank').style.color = P.rank === 1 ? '#ffd54a' : P.rank <= 3 ? '#7fe0ff' : '#fff';
  $('resTitle').textContent = (P.rank === 1 ? '🏆 冠軍！' : '比賽結果') + '　' + curTrack.name;
  $('resStats').innerHTML = [['完賽時間', fmtT(P.fin)], ['最佳單圈', P.best ? fmtT(P.best) : '-'], ['撞毀對手', P.takedowns], ['完美氮氣', P.perfects], ['擦身超車', P.nearMiss], ['獲得金幣', '+' + reward]].map(([k, v]) => `<div class="kv"><span>${k}</span><b>${v}</b></div>`).join('');
  const order = CARSALL.slice().sort((a, b) => { const fa = a.fin || 1e9 + (1e6 - a.dist), fb = b.fin || 1e9 + (1e6 - b.dist); return fa - fb; });
  $('resList').innerHTML = order.map((c, i) => `<div class="${c.isPlayer ? 'me' : ''}"><span>${i + 1}. ${c.name}</span><span class="num">${c.fin ? fmtT(c.fin) : '未完賽'}</span></div>`).join('');
  showScreen('scrResult'); $('hud').classList.add('hidden'); $('touch').classList.add('hidden');

// ================= MAIN LOOP =================
let last = performance.now();
function loop(now){
  requestAnimationFrame(loop);
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  $('rotHint').classList.toggle('hidden', !(IS_TOUCH && innerHeight > innerWidth && (state === 'race' || state === 'countdown')));
  if (state === 'menu') { audioUpdate(false); fxc.clearRect(0, 0, fx.width, fx.height); renderShow(dt); return; }
  if (state === 'paused' || state === 'result') { audioUpdate(false); renderer.render(scene, camera); return; }
  if (slowT > 0) slowT -= dt;
  const gdt = dt * (slowT > 0 ? 0.3 : 1);
  if (state === 'countdown') {
    cd -= dt;
    const label = cd > 3 ? '' : cd > 2 ? '3' : cd > 1 ? '2' : cd > 0 ? '1' : 'GO!';
    if (label !== cdShown) { cdShown = label; const el = $('count'); el.textContent = label; el.className = label === 'GO!' ? 'go' : ''; if (label) beep(label === 'GO!' ? 880 : 440, label === 'GO!' ? 0.5 : 0.18, 'square', 0.18); }
    if (cd <= 0) {
      state = 'race'; raceT = 0;
      if (performance.now() / 1000 - P.preTap < 0.4) perfectStart();
      setTimeout(() => { if ($('count').textContent === 'GO!') $('count').textContent = ''; }, 700);
    }
    CARSALL.forEach(placeCar); updateCamera(dt); updateHUD(); audioUpdate(true); updateParticles(dt);
    renderer.render(scene, camera); return;
  }
  raceT += gdt;
  updatePlayer(gdt);
  for (const a of AIS) updateAI(a, gdt);
  collisions(gdt);
  CARSALL.forEach(placeCar);
  if (P.nitroLvl && Math.random() < 0.7) { tmpV.set(0, 0.45, -P.mesh.userData.L / 2 - 0.8).applyQuaternion(P.mesh.quaternion).add(P.mesh.position); emit(tmpV.x, tmpV.y, tmpV.z, 0, 0.5, 0, 0.25, 1.2, P.nitroLvl === 3 ? 0xffa020 : P.nitroLvl === 2 ? 0xc066ff : 0x55ccff, 3, 0.7); }
  updateParticles(gdt);
  updateCamera(gdt);
  updateHUD(); drawFX(); audioUpdate(true);
  if (state === 'finished') { finishT += dt; if (finishT > 3) showResults(); }
  renderer.render(scene, camera);
}

// ================= INPUT =================
const KEYMAP = { ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right', ArrowDown: 'brake', KeyS: 'brake', ShiftLeft: 'brake' };
addEventListener('keydown', e => {
  if (KEYMAP[e.code]) { keys[KEYMAP[e.code]] = true; e.preventDefault(); }
  if ((e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') && !e.repeat) { e.preventDefault(); pressNitro(); }
  if ((e.code === 'KeyP' || e.code === 'Escape') && !e.repeat) { if (state === 'race' || state === 'countdown') pause(); else if (state === 'paused') resume(); }
});
addEventListener('keyup', e => { if (KEYMAP[e.code]) keys[KEYMAP[e.code]] = false; });
document.querySelectorAll('#touch button').forEach(b => {
  const k = b.dataset.k;
  const on = e => { e.preventDefault(); b.classList.add('on'); if (k === 'nitro') pressNitro(); else keys[k] = true; try { b.setPointerCapture(e.pointerId); } catch (_) {} };
  const off = e => { e.preventDefault(); b.classList.remove('on'); if (k !== 'nitro') keys[k] = false; };
  b.addEventListener('pointerdown', on); b.addEventListener('pointerup', off); b.addEventListener('pointercancel', off); b.addEventListener('lostpointercapture', off);
  b.addEventListener('contextmenu', e => e.preventDefault());
});
addEventListener('contextmenu', e => e.preventDefault());
addEventListener('blur', () => { keys.left = keys.right = keys.brake = false; if (state === 'race' || state === 'countdown') pause(); });
document.addEventListener('visibilitychange', () => { if (document.hidden && (state === 'race' || state === 'countdown')) pause(); });
let pausedFrom = 'race';
function pause(){ pausedFrom = state; state = 'paused'; showScreen('scrPause'); }
function resume(){ showScreen(null); state = pausedFrom; last = performance.now(); audioInit(); }

// ================= MENUS =================
const SCREENS = ['scrMain', 'scrGarage', 'scrTrack', 'scrSet', 'scrPause', 'scrResult'];
function showScreen(id){ SCREENS.forEach(s => $(s).classList.toggle('hidden', s !== id)); }
function updateCredits(){ $('credits').textContent = save.credits.toLocaleString(); }
function toMenu(){
  state = 'menu'; showScreen('scrMain'); $('hud').classList.add('hidden'); $('touch').classList.add('hidden'); $('topbar').classList.remove('hidden'); $('backLink').classList.remove('hidden'); $('count').textContent = '';
  setShowCar(save.car); updateCredits();
}
let gIdx = 0;
function renderGarage(){
  const c = CARS[gIdx]; setShowCar(gIdx);
  $('gName').textContent = c.name; $('gClass').textContent = c.cls + (save.owned.includes(gIdx) ? '' : '　💰 ' + c.price.toLocaleString());
  const bar = (lab, v, a, b, txt) => `<div class="stat"><label>${lab}</label><div class="bar"><i style="width:${clamp((v - a) / (b - a), 0.05, 1) * 100}%"></i></div><span class="v">${txt}</span></div>`;
  $('gStats').innerHTML = bar('極速', c.vmax, 65, 100, Math.round(c.vmax * 3.6) + ' km/h') + bar('加速', c.acc, 14, 33, c.acc) + bar('操控', c.hand, 1.4, 2.0, c.hand.toFixed(2)) + bar('氮氣', c.nitro, 0.9, 1.22, '×' + c.nitro.toFixed(2));
  const btn = $('gAct'), owned = save.owned.includes(gIdx);
  btn.disabled = false;
  if (owned) btn.innerHTML = '<span>' + (save.car === gIdx ? '✔ 使用中' : '選擇這台') + '</span>';
  else if (save.credits >= c.price) btn.innerHTML = '<span>購買 💰' + c.price.toLocaleString() + '</span>';
  else { btn.innerHTML = '<span>金幣不足</span>'; btn.disabled = true; }
}
$('bPlay').onclick = () => { audioInit(); buildTrackCards(); showScreen('scrTrack'); };
$('bGarage').onclick = () => { audioInit(); gIdx = save.car; showScreen('scrGarage'); renderGarage(); };
$('bSet').onclick = () => { renderSettings(); showScreen('scrSet'); };
$('gPrev').onclick = () => { gIdx = (gIdx - 1 + CARS.length) % CARS.length; renderGarage(); };
$('gNext').onclick = () => { gIdx = (gIdx + 1) % CARS.length; renderGarage(); };
$('gBack').onclick = () => { setShowCar(save.car); showScreen('scrMain'); };
$('gAct').onclick = () => {
  const c = CARS[gIdx];
  if (save.owned.includes(gIdx)) { save.car = gIdx; }
  else if (save.credits >= c.price) { save.credits -= c.price; save.owned.push(gIdx); save.car = gIdx; beep(1046, 0.2, 'triangle', 0.2); }
  persist(); updateCredits(); renderGarage();
};
function buildTrackCards(){
  $('tSel').textContent = '使用車輛：' + CARS[save.car].name + '（' + CARS[save.car].cls + '）　・　' + LAPS + ' 圈　・　8 台車';
  $('tracks').innerHTML = TRACKS.map((t, i) => `<div class="tcard" data-i="${i}" style="background:${t.grad}"><h3>${t.name}</h3><p>${t.desc}</p></div>`).join('');
  document.querySelectorAll('.tcard').forEach(el => el.onclick = () => startRace(+el.dataset.i));
}
$('tBack').onclick = () => showScreen('scrMain');
function renderSettings(){
  $('oQ').textContent = save.quality === 'high' ? '高' : '低'; $('oQ').classList.toggle('on', save.quality === 'high');
  $('oS').textContent = save.sound ? '開' : '關'; $('oS').classList.toggle('on', save.sound);
  $('oT').textContent = save.touch ? '開' : '關'; $('oT').classList.toggle('on', save.touch);
}
$('oQ').onclick = () => { save.quality = save.quality === 'high' ? 'low' : 'high'; persist(); applyPR(); resize(); renderSettings(); };
$('oS').onclick = () => { save.sound = !save.sound; persist(); setVol(); renderSettings(); };
$('oT').onclick = () => { save.touch = !save.touch; persist(); renderSettings(); };
$('sBack').onclick = () => showScreen('scrMain');
$('bPause').onclick = () => { if (state === 'race' || state === 'countdown') pause(); };
$('pResume').onclick = resume;
$('pRestart').onclick = () => startRace(curTrackIdx);
$('pQuit').onclick = toMenu;
$('rAgain').onclick = () => startRace(curTrackIdx);
$('rMenu').onclick = toMenu;

addEventListener('resize', resize);
resize(); toMenu(); requestAnimationFrame(loop);
</script>
</body>
</html>
