<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{height:100%;background:#0b0f14;overflow:hidden;touch-action:none;

canvas{display:block;position:fixed;inset:0;width:100%;height:100%}

button{font:inherit;color:inherit;cursor:pointer}

/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none;z-index:3}
#xpWrap{position:absolute;top:0;left:0;right:0;height:16px;background:#0009;border-bottom:1px solid #fff2}
#xpFill{height:100%;width:0;background:linear-gradient(90deg,#2f8cff,#5fe0ff);transition:width .15s}
#lvTxt{position:absolute;left:50%;top:0;transform:translateX(-50%);font-size:12px;font-weight:800;line-height:16px;text-shadow:0 1px 2px #000}
#topRow{position:absolute;top:22px;left:10px;right:10px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
#skills{display:flex;flex-wrap:wrap;gap:3px;max-width:42vw}
.sk{width:28px;height:28px;border-radius:7px;background:#000a;border:1px solid #fff3;display:flex;align-items:center;justify-content:center;font-size:16px;position:relative}
.sk.pas{border-color:#5fd06866}
.sk.evo{border-color:#ffb21e;box-shadow:0 0 6px #ffb21e}
.sk i{position:absolute;bottom:-3px;right:-2px;font-style:normal;font-size:9px;font-weight:900;background:#000;border-radius:4px;padding:0 2px;color:#ffcc33}
#timer{font-size:26px;font-weight:900;text-shadow:0 2px 4px #000;letter-spacing:1px;text-align:center;line-height:1}

#stats{display:flex;flex-direction:column;align-items:flex-end;gap:2px;font-size:14px;text-shadow:0 1px 3px #000}
#bossBar{position:absolute;top:84px;left:50%;transform:translateX(-50%);width:min(520px,80vw);text-align:center}
#bossName{font-size:14px;font-weight:900;color:#ff6b5b;text-shadow:0 1px 3px #000;margin-bottom:3px}
#bossTrack{height:12px;background:#000b;border:1px solid #ff6b5b88;border-radius:6px;overflow:hidden}
#bossFill{height:100%;width:100%;background:linear-gradient(90deg,#c41f12,#ff5b3d)}
#pauseBtn{position:absolute;bottom:calc(14px + env(safe-area-inset-bottom));right:14px;pointer-events:auto;background:#000a;border:1px solid #fff4;border-radius:10px;width:46px;height:42px;font-size:20px}
#banner{position:absolute;top:34%;left:0;right:0;text-align:center;font-size:clamp(22px,5vw,38px);font-weight:900;color:#ff5b3d;

a.back{color:#9fb0c2;font-size:13px;text-decoration:none;background:#fff1;padding:6px 10px;border-radius:8px}
.gold{font-size:18px;font-weight:800;color:#ffcc33;background:#0008;padding:5px 14px;border-radius:20px;border:1px solid #ffcc3355}
#muteBtn{background:#fff1;border:0;border-radius:8px;width:38px;height:32px;font-size:16px}
#lobby main{flex:1;overflow-y:auto;padding:4px 14px 20px;touch-action:pan-y}
.tab{display:none;max-width:640px;margin:0 auto}

h1{font-size:clamp(40px,10vw,72px);font-weight:900;letter-spacing:6px;color:#ff4d3d;text-align:center;

h3{font-size:17px;margin:14px 0 8px;color:#ffd9cf}

.power{text-align:center;margin-top:10px;color:#b9c3cf}

.statline{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;font-size:13px;color:#cfd8e3;margin-top:4px}

.panel{background:#121922;border:1px solid #243040;border-radius:14px;padding:14px;text-align:center}

#stageCard{flex:1}

#stageCard .nm{font-size:24px;font-weight:900;margin:2px 0}
#stageCard .info{font-size:13px;color:#b9c3cf;line-height:1.7}
.lock{color:#ff8a7a}
.btn{display:block;width:100%;margin-top:14px;background:#ff4d3d;border:0;border-radius:14px;padding:15px;font-size:22px;font-weight:900;letter-spacing:6px;box-shadow:0 5px 0 #8a1a10}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #8a1a10}

.btn.gray{background:#33404f;box-shadow:0 5px 0 #1a222b}
.hint{font-size:13px;color:#8a99a8;text-align:center;margin-top:12px;line-height:1.7}

.slot .name{font-size:12px;margin-top:2px}
.itm{min-height:72px;background:linear-gradient(#121922,#121922) padding-box,var(--rc) border-box}
.inv{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:7px}
.itm .mg{position:absolute;top:2px;right:5px;font-size:10px;color:#ffcc33;font-weight:900}
.empty-txt{color:#6a7889;font-size:13px;text-align:center;padding:16px}
.tal{display:flex;align-items:center;gap:10px;background:#121922;border:1px solid #243040;border-radius:12px;padding:10px 12px;margin-bottom:8px}
.tal .ic{font-size:26px;width:34px;text-align:center}
.tal .tx{flex:1;font-size:13px;color:#b9c3cf}
.tal .tx b{display:block;font-size:15px;color:#fff}
.tal button,.mini{background:#ff4d3d;border:0;border-radius:10px;padding:8px 10px;font-size:13px;font-weight:800;min-width:84px}

.shopCard{display:flex;align-items:center;gap:12px;background:#121922;border:1px solid #243040;border-radius:14px;padding:14px;margin-bottom:10px}

.shopCard .tx{flex:1;font-size:12px;color:#9fb0c2;line-height:1.6}
.shopCard .tx b{display:block;font-size:17px;color:#fff}

/* ---------- Modal ---------- */
#modal{position:fixed;inset:0;z-index:10;background:#000b;display:flex;align-items:center;justify-content:center;padding:12px}
.mbox{background:#141b24;border:1px solid #2c3a4a;border-radius:18px;padding:18px;width:min(620px,96vw);max-height:92vh;overflow-y:auto;text-align:center;touch-action:pan-y}
.mbox h2{font-size:28px;font-weight:900;color:#ffcc33;margin-bottom:4px;letter-spacing:2px}
.mbox h2.red{color:#ff5b3d}
.mbox p{color:#b9c3cf;font-size:14px;line-height:1.7}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-top:14px}

.card b{font-size:16px;color:#fff}

.card .tag.n{background:#2f8cff}

.card .pair{font-size:11px;color:#ffb21e}
.res{display:flex;flex-direction:column;gap:8px;margin:14px 0}
.res div{background:#1b2532;border-radius:10px;padding:10px;font-size:15px}
.res .ev{background:linear-gradient(90deg,#5a3a00,#3a2600);border:1px solid #ffb21e;color:#ffd77a;font-weight:800}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:12px 0;font-size:14px}
.kv div{background:#1b2532;border-radius:10px;padding:8px}
.kv b{display:block;font-size:20px;color:#ffcc33}
.itemHead{display:flex;align-items:center;gap:12px;text-align:left;border:2px solid var(--rc);border-radius:14px;padding:10px;background:#0e141b}
.itemHead .ic{font-size:44px}
.itemHead b{font-size:20px;display:block}
.itemHead small{color:var(--rc);font-weight:800}
.statList{text-align:left;font-size:14px;color:#cfd8e3;line-height:1.9;margin:10px 4px}
.btnRow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.btnRow .mini{padding:11px 6px;font-size:14px}
.mini.gray{background:#33404f}
.loot{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:12px 0}
.loot .itm{width:84px}
.skillList{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:10px 0}
.skillList .sk{width:40px;height:40px;font-size:22px}

</head>

/* ================== UPDATE ================== */
const keys={};let joy=null;
function update(dt){
  const p=G.p;G.t+=dt;
  if(G.winT>0){G.winT-=dt;if(G.winT<=0){endRun(true);return}}
  // timeline
  if(G.mode==='stage'){while(G.sched.length&&G.t>=G.sched[0].t){const ev=G.sched.shift();if(ev.k==='elite')spawnElite();else spawnBoss(ev.k==='boss')}}
  else{if(G.t>=G.nextElite){spawnElite();G.nextElite+=75}if(G.t>=G.nextBoss&&!G.boss){spawnBoss(false);G.nextBoss+=240}}
  // movement
  let mx=0,my=0;if(keys.KeyA||keys.ArrowLeft)mx--;if(keys.KeyD||keys.ArrowRight)mx++;if(keys.KeyW||keys.ArrowUp)my--;if(keys.KeyS||keys.ArrowDown)my++;
  if(joy&&joy.on){const dx=joy.x-joy.ox,dy=joy.y-joy.oy,l=Math.hypot(dx,dy);if(l>6){mx=dx/Math.max(l,40);my=dy/Math.max(l,40)}}

  if(G.arena){const A=G.arena,dx=p.x-A.x,dy=p.y-A.y,d=Math.hypot(dx,dy);if(d>A.r-p.r){p.x=A.x+dx/d*(A.r-p.r);p.y=A.y+dy/d*(A.r-p.r)}}
  p.inv-=dt;p.fl-=dt;if(G.m.regen>0)p.hp=Math.min(p.maxHp,p.hp+G.m.regen*dt);
  // spawn
  if(G.winT<0){const maxE=Math.min(260,25+G.t*.7);let rate=Math.min(G.mode==='stage'?11:15,1.3+G.t/35);if(G.boss)rate*=.35;
    G.spawnAcc+=rate*dt;while(G.spawnAcc>=1){G.spawnAcc--;if(G.en.length<maxE)spawnEnemy(pickType())}
    if(G.t>=G.nextEvent&&!G.boss){G.nextEvent+=50;(G.evN++%2?batEvent:ringEvent)()}
    G.crateT-=dt;if(G.crateT<=0){G.crateT=18;spawnCrate()}}
  buildGrid();
  // enemies
  const A=G.arena;
  for(const e of G.en){if(e.dead)continue;e.fl-=dt;if(e.crate)continue;
    let sp=e.spd*(e.slowT>0?1-e.slowA:1);e.slowT-=dt;const dx=p.x-e.x,dy=p.y-e.y,d=Math.hypot(dx,dy)||1;
    if(e.dir!==undefined){e.x+=Math.cos(e.dir)*sp*dt;e.y+=Math.sin(e.dir)*sp*dt;e.life-=dt;if(e.life<=0)e.dead=true}
    else if(e.boss)bossAI(e,dt,dx,dy,d,sp);
    else if(e.type==='spitter'&&!e.elite){if(d>230){e.x+=dx/d*sp*dt;e.y+=dy/d*sp*dt}else if(d<170){e.x-=dx/d*sp*.6*dt;e.y-=dy/d*sp*.6*dt}
      e.cd-=dt;if(e.cd<=0&&d<420){e.cd=2.4;G.eb.push({x:e.x,y:e.y,vx:dx/d*190,vy:dy/d*190,r:6,dmg:e.dmg,life:3})}}
    else{e.x+=dx/d*sp*dt;e.y+=dy/d*sp*dt}
    // separation
    if(!e.boss){const k=Math.floor(e.x/CELL)*100003+Math.floor(e.y/CELL);const a=grid.get(k);if(a){let c=0;for(const o of a){if(o===e||o.dead||o.crate)continue;const ox=e.x-o.x,oy=e.y-o.y,rr=e.r+o.r;const d2=ox*ox+oy*oy;if(d2<rr*rr&&d2>.01){const dd=Math.sqrt(d2),push=(rr-dd)*.5;e.x+=ox/dd*push;e.y+=oy/dd*push}if(++c>8)break}}}
    if(A&&e.out){const ax=e.x-A.x,ay=e.y-A.y,ad=Math.hypot(ax,ay)||1;if(ad<A.r+e.r){e.x=A.x+ax/ad*(A.r+e.r);e.y=A.y+ay/ad*(A.r+e.r)}}
    // contact
    if(d<e.r+p.r){if(e.type==='bomber'&&!e.elite){kill(e)}else hurt(e.dmg)}
    if(G.over)return;
    // despawn far
    if(!e.boss&&!e.elite&&d>Math.hypot(VW,VH)*1.1){const a=Math.random()*Math.PI*2,r=Math.hypot(VW,VH)/2+40;e.x=p.x+Math.cos(a)*r;e.y=p.y+Math.sin(a)*r;if(A&&e.out){const ax=e.x-A.x,ay=e.y-A.y,ad=Math.hypot(ax,ay)||1;if(ad<A.r+40){e.x=A.x+ax/ad*(A.r+50);e.y=A.y+ay/ad*(A.r+50)}}}
  }
  // weapons
  for(const w of G.W)WU[w.id](w,dt);
  // player projectiles

    if(b.k==='kunai'){if(b.home){const t=nearest(b.x,b.y,260,b.hit);if(t){const a=Math.atan2(t.y-b.y,t.x-b.x),c=Math.atan2(b.vy,b.vx);let da=a-c;while(da>Math.PI)da-=6.283;while(da<-Math.PI)da+=6.283;const na=c+clamp(da,-7*dt,7*dt),s=Math.hypot(b.vx,b.vy);b.vx=Math.cos(na)*s;b.vy=Math.sin(na)*s}}
      b.x+=b.vx*dt;b.y+=b.vy*dt;near(b.x,b.y,b.r,e=>{if(b.dead||b.hit.has(e))return;b.hit.add(e);hit(e,b.dmg);if(--b.pierce<=0)b.dead=true})}
    else if(b.k==='ball'){b.x+=b.vx*dt;b.y+=b.vy*dt;b.spin+=dt*10;const L=p.x-VW/2+b.r,R=p.x+VW/2-b.r,T=p.y-VH/2+b.r+20,B=p.y+VH/2-b.r;
      if(b.x<L){b.x=L;b.vx=Math.abs(b.vx)}if(b.x>R){b.x=R;b.vx=-Math.abs(b.vx)}if(b.y<T){b.y=T;b.vy=Math.abs(b.vy)}if(b.y>B){b.y=B;b.vy=-Math.abs(b.vy)}
      near(b.x,b.y,b.r,e=>{if(cdOK(e,b.key,.3)){hit(e,b.dmg);if(b.evo)explode(e.x,e.y,55*G.m.area,b.dmg*.5,'#ffd34a')}})}
    else if(b.k==='missile'){if(!b.tg||b.tg.dead)b.tg=nearest(b.x,b.y,400);if(b.tg){const dx=b.tg.x-b.x,dy=b.tg.y-b.y,d=Math.hypot(dx,dy)||1;b.vx+=dx/d*1400*dt;b.vy+=dy/d*1400*dt}
      const s=Math.hypot(b.vx,b.vy),mxs=520*G.m.ps;if(s>mxs){b.vx*=mxs/s;b.vy*=mxs/s}b.x+=b.vx*dt;b.y+=b.vy*dt;
      let boom=false;near(b.x,b.y,b.r,e=>{if(!e.crate||true)boom=true});if(boom){b.dead=true;explode(b.x,b.y,b.R,b.dmg)}
      if(Math.random()<.5)G.fx.push({k:'smoke',x:b.x,y:b.y,r:4,life:.3,max:.3})}
    else if(b.k==='bottle'){b.t+=dt;const k=Math.min(1,b.t/b.dur);b.x=b.sx+(b.tx-b.sx)*k;b.y=b.sy+(b.ty-b.sy)*k-Math.sin(k*Math.PI)*60;
      if(k>=1){b.dead=true;const ar=G.m.area;G.pools.push({x:b.tx,y:b.ty,r:(b.evo?75:45)*ar,life:(b.evo?4:3)*ar,max:(b.evo?4:3)*ar,t:0,dmg:b.dmg})}}}
  G.pb=G.pb.filter(b=>!b.dead);
  for(const pl of G.pools){pl.life-=dt;pl.t-=dt;if(pl.t<=0){pl.t=.4;near(pl.x,pl.y,pl.r,e=>hit(e,pl.dmg))}}
  G.pools=G.pools.filter(pl=>pl.life>0);
  // enemy bullets
  for(const b of G.eb){b.life-=dt;b.x+=b.vx*dt;b.y+=b.vy*dt;if(Math.hypot(b.x-p.x,b.y-p.y)<b.r+p.r){b.life=0;hurt(b.dmg)}}
  G.eb=G.eb.filter(b=>b.life>0);if(G.over)return;
  // gems & items
  const pick=G.m.pick;
  for(const g of G.gems){const dx=p.x-g.x,dy=p.y-g.y,d=Math.hypot(dx,dy)||1;if(!g.mag&&d<pick)g.mag=true;
    if(g.mag){g.sp=(g.sp||200)+900*dt;g.x+=dx/d*g.sp*dt;g.y+=dy/d*g.sp*dt;if(d<p.r+8){g.dead=true;gainXp(g.v);snd('pick')}}}
  G.gems=G.gems.filter(g=>!g.dead);
  for(const it of G.items){const dx=p.x-it.x,dy=p.y-it.y,d=Math.hypot(dx,dy)||1;if(!it.mag&&d<pick*(it.k==='chest'?.5:1))it.mag=true;
    if(it.mag){it.sp=(it.sp||150)+700*dt;it.x+=dx/d*it.sp*dt;it.y+=dy/d*it.sp*dt;if(d<p.r+10){it.dead=true;takeItem(it)}}}
  G.items=G.items.filter(i=>!i.dead);
  // fx
  for(const f of G.fx)f.life-=dt;G.fx=G.fx.filter(f=>f.life>0);
  for(const t of G.txt){t.life-=dt;t.y-=40*dt}G.txt=G.txt.filter(t=>t.life>0);
  G.en=G.en.filter(e=>!e.dead);
}
function bossAI(e,dt,dx,dy,d,sp){e.pt-=dt;
  if(e.state==='walk'){e.x+=dx/d*sp*dt;e.y+=dy/d*sp*dt;if(e.pt<=0){const pat=e.pn++%(e.final?3:2);
      if(pat===0){e.state='tele';e.pt=.75;e.da=Math.atan2(dy,dx)}
      else if(pat===1){const n=e.final?18:12;for(let i=0;i<n;i++){const a=i/n*Math.PI*2+e.pn;G.eb.push({x:e.x,y:e.y,vx:Math.cos(a)*170,vy:Math.sin(a)*170,r:8,dmg:e.dmg*.6,life:4})}e.pt=2.6;snd('boom')}
      else{for(let i=0;i<6;i++){const a=i/6*Math.PI*2;spawnEnemy('zombie',{x:e.x+Math.cos(a)*60,y:e.y+Math.sin(a)*60,inside:true})}e.pt=2.6}}}
  else if(e.state==='tele'){if(e.pt<=0){e.state='dash';e.pt=.55}}
  else if(e.state==='dash'){e.x+=Math.cos(e.da)*560*dt;e.y+=Math.sin(e.da)*560*dt;if(e.pt<=0){e.state='walk';e.pt=2.4}}
  const A=G.arena;if(A){const ax=e.x-A.x,ay=e.y-A.y,ad=Math.hypot(ax,ay)||1;if(ad>A.r-e.r){e.x=A.x+ax/ad*(A.r-e.r);e.y=A.y+ay/ad*(A.r-e.r)}}}
function gainXp(v){G.xp+=v;while(G.xp>=G.need){G.xp-=G.need;G.lv++;G.need=xpNeed(G.lv);G.queue.push('lv')}G.hudDirty=true;showNext()}
function takeItem(it){
  if(it.k==='coin'){G.coins+=it.v;snd('pick')}
  else if(it.k==='meat'){G.p.hp=Math.min(G.p.maxHp,G.p.hp+G.p.maxHp*.3);G.txt.push({x:G.p.x,y:G.p.y-24,s:'回血',c:false,life:.8,green:true});snd('pick')}
  else if(it.k==='magnet'){for(const g of G.gems)g.mag=true;for(const i of G.items)if(i.k==='coin')i.mag=true;snd('chest')}

  // gear
  let sh='';for(const[slot,sn]of SLOTS){const it=itemById(SV.eq[slot]);if(!it){sh+=`<div class="slot empty"><span class="sn">${sn}</span>空</div>`;continue}
    const g=GEAR[it.type],r=RAR[it.rar];sh+=`<div class="slot itm" style="--rc:${r.c}" data-id="${it.id}"><span class="sn">${sn}</span><span class="ic">${g.i}</span><span class="name">${g.n}</span><span class="lv">${r.n} Lv${it.lv}</span></div>`}
  $('#slots').innerHTML=sh;
  const bag=SV.inv.filter(i=>!isEq(i)).sort((a,b)=>b.rar-a.rar||a.type.localeCompare(b.type)||b.lv-a.lv);
  $('#invCount').textContent=`${bag.length} 件`;
  $('#inv').innerHTML=bag.length?bag.map(it=>{const n=SV.inv.filter(o=>o.type===it.type&&o.rar===it.rar).length;return itemHTML(it).replace('</div>',(n>=3&&it.rar<4?'<span class="mg">可合成</span>':'')+'</div>')}).join(''):'<div class="empty-txt" style="grid-column:1/-1">背包是空的，去商店開寶箱或打關卡拿裝備吧</div>';
  document.querySelectorAll('#slots .itm,#inv .itm').forEach(el=>el.onclick=()=>itemModal(+el.dataset.id));
  // talents
  $('#talents').innerHTML=TAL.map(t=>{const l=SV.tal[t.k],c=talCost(l),max=l>=TAL_MAX;return`<div class="tal"><span class="ic">${t.i}</span><div class="tx"><b>${t.n}　Lv ${l}</b>${t.f(l)}${max?'':`　→　${t.f(l+1)}`}</div><button data-k="${t.k}" ${max||SV.gold<c?'disabled':''}>${max?'已滿級':'🪙 '+c}</button></div>`}).join('');
  document.querySelectorAll('#talents button').forEach(b=>b.onclick=()=>{const k=b.dataset.k,c=talCost(SV.tal[k]);if(SV.gold<c||SV.tal[k]>=TAL_MAX)return;SV.gold-=c;SV.tal[k]++;save();snd('lvl');renderLobby()});
  // shop
  $('#shop').innerHTML=SHOP.map((c,i)=>`<div class="shopCard"><span class="ic">${c.i}</span><div class="tx"><b>${c.n}</b>${c.d}</div><button class="mini" data-i="${i}" ${SV.gold<c.cost?'disabled':''}>🪙 ${c.cost}</button></div>`).join('')+
    `<p class="hint">玩關卡和無限模式都能賺金幣，過關還會掉裝備</p>`;
  document.querySelectorAll('#shop .mini').forEach(b=>b.onclick=()=>buyChest(+b.dataset.i));
}
const SHOP=[
  {n:'普通寶箱',i:'📦',cost:300,cnt:1,w:[70,25,5,0,0],d:'普通 70%　優秀 25%　精良 5%'},
  {n:'高級寶箱',i:'🎁',cost:1200,cnt:1,w:[0,55,33,10,2],d:'優秀 55%　精良 33%　史詩 10%　傳說 2%'},
  {n:'高級寶箱 ×5',i:'💎',cost:5400,cnt:5,w:[0,55,33,10,2],d:'一次開 5 個，便宜 10%'},
];
function buyChest(i){const c=SHOP[i];if(SV.gold<c.cost)return;SV.gold-=c.cost;const got=[];for(let k=0;k<c.cnt;k++)got.push(rollGear(c.w));SV.inv.push(...got);save();snd('chest');
  const m=openModal(`<h2>${c.i} 開箱結果</h2><div class="loot">${got.map(itemHTML).join('')}</div><button class="btn sm">好</button>`);
  m.querySelector('.btn').onclick=()=>{closeModal();renderLobby()};renderLobby()}
function itemModal(id){const it=itemById(id);if(!it)return;const g=GEAR[it.type],r=RAR[it.rar],eq=isEq(it);const st=itemStats(it);
  const same=SV.inv.filter(o=>o!==it&&o.type===it.type&&o.rar===it.rar&&!isEq(o));const canMerge=it.rar<4&&same.length>=2;const cost=upCost(it),maxed=it.lv>=r.max;
  const nxt={...it,lv:it.lv+1};const st2=itemStats(nxt);
  const m=openModal(`<div class="itemHead" style="--rc:${r.c}"><span class="ic">${g.i}</span><div><b>${g.n}</b><small>${r.n}　·　${SLOTS.find(s=>s[0]===g.slot)[1]}　·　Lv ${it.lv}/${r.max}</small></div></div>
    <div class="statList">${Object.keys(st).map(k=>fmtStat(k,st[k])+(maxed?'':`　<span style="color:#5fe06b">→ ${fmtStat(k,st2[k]).split('+')[1]}</span>`)).join('<br>')}${g.start?`<br>開局技能：${WEP[g.start].i} ${WEP[g.start].n}`:''}</div>
    <div class="btnRow">
      ${eq?`<button class="mini gray" id="iUn" ${g.slot==='weapon'?'disabled':''}>${g.slot==='weapon'?'武器不能卸下':'卸下'}</button>`:`<button class="mini" id="iEq">裝備</button>`}
      <button class="mini" id="iUp" ${maxed||SV.gold<cost?'disabled':''}>${maxed?'已滿級':'升級 🪙'+cost}</button>
      <button class="mini" id="iMg" ${canMerge?'':'disabled'}>${it.rar>=4?'已是最高稀有度':`合成 (${Math.min(3,same.length+1)}/3)`}</button>
      <button class="mini gray" id="iSell" ${eq?'disabled':''}>賣掉 🪙${sellVal(it)}</button>
    </div><button class="btn sm gray" id="iClose">關閉</button>`);
  const re=()=>{save();renderLobby();itemModal(id)};
  const q=s=>m.querySelector(s);
  if(q('#iEq'))q('#iEq').onclick=()=>{SV.eq[g.slot]=it.id;snd('pick');re()};
  if(q('#iUn'))q('#iUn').onclick=()=>{if(g.slot==='weapon')return;delete SV.eq[g.slot];re()};
  q('#iUp').onclick=()=>{if(maxed||SV.gold<cost)return;SV.gold-=cost;it.lv++;snd('lvl');re()};
  q('#iMg').onclick=()=>{if(!canMerge)return;const used=same.sort((a,b)=>a.lv-b.lv).slice(0,2);const refund=used.reduce((s,o)=>s+(o.lv-1)*15,0);
    SV.inv=SV.inv.filter(o=>!used.includes(o));it.rar++;SV.gold+=refund;snd('chest');re()};
  q('#iSell').onclick=()=>{if(eq)return;SV.gold+=sellVal(it);SV.inv=SV.inv.filter(o=>o!==it);save();closeModal();renderLobby()};
  q('#iClose').onclick=()=>{closeModal();renderLobby()}}
document.querySelectorAll('#lobby nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#lobby nav button').forEach(o=>o.classList.toggle('on',o===b));
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.id==='tab-'+b.dataset.tab));renderLobby()});
document.querySelectorAll('.mode').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;SV.mode=mode;save();renderLobby()});
$('#stPrev').onclick=()=>{SV.stage=Math.max(0,SV.stage-1);save();renderLobby()};
$('#stNext').onclick=()=>{SV.stage=Math.min(SV.cleared,STAGES.length-1,SV.stage+1);save();renderLobby()};
$('#muteBtn').onclick=()=>{SV.mute=!SV.mute;save();renderLobby()};
$('#startBtn').onclick=()=>{snd('pick');newGame(mode)};
renderLobby();
window.LD={get G(){return G},get SV(){return SV},newGame,save};
</script>
</body>
</html>
