<!DOCTYPE html>
<html lang="zh-Hant">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>微笑的深淵 The Smiling Abyss</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Heiti TC",sans-serif;color:#fff;touch-action:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;transition:filter .1s}
.ov{position:fixed;inset:0;pointer-events:none}
#vig{background:radial-gradient(ellipse at center,rgba(0,0,0,0) 35%,rgba(0,0,0,.95) 100%);opacity:0}
#red{background:#8a0000;mix-blend-mode:multiply;opacity:0}
#blood{opacity:0;background:
 radial-gradient(ellipse 30% 22% at 0% 0%,rgba(120,0,0,.95),rgba(120,0,0,0) 100%),
 radial-gradient(ellipse 25% 30% at 100% 0%,rgba(110,0,0,.9),rgba(110,0,0,0) 100%),
 radial-gradient(ellipse 35% 20% at 0% 100%,rgba(100,0,0,.9),rgba(100,0,0,0) 100%),
 radial-gradient(ellipse 30% 25% at 100% 100%,rgba(120,0,0,.9),rgba(120,0,0,0) 100%)}
#drips{opacity:0}
#drips i{position:absolute;top:-10%;width:1.2vw;min-width:6px;border-radius:0 0 50% 50%;background:linear-gradient(#5a0000,#a10000);animation:drip linear infinite}
@keyframes drip{from{transform:translateY(0)}to{transform:translateY(55vh)}}
#corpse{opacity:0;background:
 radial-gradient(circle at 30% 40%,rgba(130,0,0,.85) 0,rgba(130,0,0,0) 22%),
 radial-gradient(circle at 70% 65%,rgba(110,0,0,.8) 0,rgba(110,0,0,0) 18%),
 repeating-linear-gradient(90deg,#262b1d 0 40px,#2d3323 40px 80px);}
#grain{opacity:0;mix-blend-mode:overlay;background-size:256px 256px}
#drops{opacity:0;transition:opacity 1.5s}
#drops i{position:absolute;border-radius:50%;background:radial-gradient(circle at 35% 35%,rgba(255,255,255,.35),rgba(220,235,245,.06) 45%,rgba(60,80,90,.12) 68%,rgba(255,255,255,0) 72%);}
#dof{opacity:0;transition:opacity .6s;-webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px);-webkit-mask-image:radial-gradient(ellipse 34% 40% at 50% 46%,transparent 55%,#000 100%);mask-image:radial-gradient(ellipse 34% 40% at 50% 46%,transparent 55%,#000 100%)}
#lbT,#lbB{position:fixed;left:0;width:100%;height:0;background:#000;pointer-events:none;transition:height .8s}
#lbT{top:0}#lbB{bottom:0}
#reel{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;background:#1a1610;color:#e8dcc0;font-family:Georgia,"Times New Roman",serif;text-align:center;z-index:12;animation:flick .12s infinite}
#reel .a{font-size:clamp(26px,5vw,60px);font-weight:900;letter-spacing:4px;text-shadow:0 0 8px #000}
#reel .b{font-size:clamp(14px,2.2vw,22px);margin-top:16px;letter-spacing:3px;opacity:.8}
@keyframes flick{0%{opacity:1}50%{opacity:.88}100%{opacity:.97}}
#black{background:#000;opacity:0}
#white{background:#fff;opacity:0}
#lidT,#lidB{position:fixed;left:-5%;width:110%;height:0;background:#000;pointer-events:none}
#lidT{top:0;border-radius:0 0 50% 50%/0 0 30% 30%}
#lidB{bottom:0;border-radius:50% 50% 0 0/30% 30% 0 0}
#sub{position:fixed;left:50%;bottom:11%;transform:translateX(-50%);max-width:90%;text-align:center;font-size:clamp(16px,2.4vw,26px);text-shadow:0 0 6px #000,0 0 3px #000;line-height:1.5;pointer-events:none}
#sub b{color:#ffd27a}
#center{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none;padding:5%}
#type{position:fixed;left:0;right:0;bottom:30%;text-align:center;font-family:"Courier New",monospace;font-size:clamp(18px,3vw,34px);letter-spacing:2px;text-shadow:0 0 8px #000;pointer-events:none}
#hud{position:fixed;top:12px;left:50%;transform:translateX(-50%);font-size:clamp(13px,1.8vw,18px);color:#eee;text-shadow:0 0 4px #000;pointer-events:none;text-align:center}
#obj{position:fixed;top:12px;left:14px;font-size:clamp(13px,1.8vw,17px);color:#ffe9a8;text-shadow:0 0 4px #000;pointer-events:none;max-width:45%}
#prompt{position:fixed;left:50%;top:62%;transform:translateX(-50%);padding:8px 16px;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.35);border-radius:8px;font-size:clamp(14px,2vw,19px);display:none;pointer-events:none}
#hold{position:fixed;left:50%;top:70%;transform:translateX(-50%);width:220px;height:8px;background:rgba(255,255,255,.2);border-radius:4px;display:none;overflow:hidden}
#hold i{display:block;height:100%;width:0;background:#e33}
#qte{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);text-align:center;width:92%;display:none;pointer-events:none}
#qte .t{font-size:clamp(22px,4.5vw,48px);font-weight:900;color:#fff;text-shadow:0 0 12px #f00,0 0 4px #000;animation:pulse .35s infinite alternate}
#qte .bar{margin:14px auto 0;width:min(70vw,420px);height:14px;border:2px solid #fff;border-radius:8px;overflow:hidden}
#qte .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#f33,#ff0)}
@keyframes pulse{from{transform:scale(1)}to{transform:scale(1.08)}}
#icon{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);display:none;text-align:center;pointer-events:none;animation:pulse .6s infinite alternate}
#icon .hint{font-size:clamp(14px,2vw,20px);margin-top:8px;text-shadow:0 0 4px #000}
#spam{position:fixed;inset:0;pointer-events:none;overflow:hidden}
#spam div{position:absolute;color:#e00;font-weight:900;white-space:nowrap;text-shadow:0 0 6px #000}
#choice{position:fixed;left:50%;bottom:16%;transform:translateX(-50%);display:none;gap:12px;flex-wrap:wrap;justify-content:center;width:92%}
#choice button,.btn{font:inherit;font-size:clamp(15px,2.2vw,20px);padding:12px 22px;background:rgba(15,15,15,.85);color:#fff;border:1px solid #aaa;border-radius:8px;cursor:pointer;pointer-events:auto}
#choice button:hover,.btn:hover{background:#600;border-color:#f66}
#end{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:#000;padding:5%}
#end .big{font-size:clamp(34px,7vw,80px);font-weight:900;letter-spacing:6px}
#end .mid{font-size:clamp(20px,3.6vw,40px);margin-top:14px;letter-spacing:3px}
#end .small{font-size:clamp(15px,2.2vw,22px);margin-top:22px;opacity:.85}
#end .help{font-size:clamp(12px,1.6vw,15px);margin-top:26px;color:#9ab;max-width:600px;line-height:1.6}
#end .btns{margin-top:36px;display:none;gap:12px;flex-wrap:wrap;justify-content:center}
#end .col{margin-top:18px;font-size:14px;color:#aaa;display:none}
#end .fade{opacity:0;transition:opacity 2s}
#title{position:fixed;inset:0;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:6%;cursor:pointer}
#title .w{color:#c00;font-weight:900;font-size:clamp(18px,3.2vw,34px);line-height:1.6;opacity:0;transition:opacity 2.5s;max-width:900px}
#title .s{margin-top:40px;color:#fff;font-size:clamp(14px,2vw,20px);opacity:0;animation:blink 1.4s infinite}
#title .opts{margin-top:30px;display:none;gap:10px;flex-wrap:wrap;justify-content:center}
#title .opts button{font-size:14px;padding:8px 14px}
@keyframes blink{0%,100%{opacity:.15}50%{opacity:.9}}
#touch{display:none;position:fixed;inset:0;pointer-events:none;z-index:5}
#touch>*{pointer-events:auto}
body.touch.ctl #touch{display:block}
#choice{z-index:20}#end{z-index:30}#title{z-index:40}#err{z-index:50}
#lockhint{position:fixed;left:50%;bottom:4%;transform:translateX(-50%);font-size:13px;color:#ccc;background:rgba(0,0,0,.45);padding:4px 10px;border-radius:6px;display:none;pointer-events:none}
#joy{position:fixed;left:4%;bottom:6%;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.25);touch-action:none}
#joy i{position:absolute;left:40px;top:40px;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.35)}
#ebtn{position:fixed;right:5%;bottom:10%;width:84px;height:84px;border-radius:50%;background:rgba(255,255,255,.15);border:2px solid rgba(255,255,255,.5);font-size:30px;font-weight:900;display:flex;align-items:center;justify-content:center;touch-action:none}
#lookzone{position:fixed;right:0;top:0;width:58%;height:100%;touch-action:none}
#err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#000;color:#f66;padding:10%;text-align:center;font-size:18px}
#skip{position:fixed;right:12px;top:10px;font-size:12px;color:#777;display:none;pointer-events:auto;cursor:pointer;background:none;border:none}
</style>
</head>

  <div class="w">警告：本遊戲包含大量真實戰爭、血腥、斷肢、開腸破肚以及高壓 QTE 限時抉擇畫面，心臟不適者請斟酌遊玩。</div>

<script>
'use strict';
// ================= Mini3D：自製輕量 WebGL 方塊引擎 =================
function hex(c){ if(Array.isArray(c)) return c.slice(); return [((c>>16)&255)/255,((c>>8)&255)/255,(c&255)/255]; }
function m4(){ const m=new Float32Array(16); m[0]=m[5]=m[10]=m[15]=1; return m; }
const _tmp=new Float32Array(16);
function m4mul(out,a,b){
  for(let i=0;i<4;i++){
    const b0=b[i*4],b1=b[i*4+1],b2=b[i*4+2],b3=b[i*4+3];
    _tmp[i*4]  =a[0]*b0+a[4]*b1+a[8]*b2+a[12]*b3;
    _tmp[i*4+1]=a[1]*b0+a[5]*b1+a[9]*b2+a[13]*b3;
    _tmp[i*4+2]=a[2]*b0+a[6]*b1+a[10]*b2+a[14]*b3;
    _tmp[i*4+3]=a[3]*b0+a[7]*b1+a[11]*b2+a[15]*b3;
  }
  out.set(_tmp); return out;
}
function m4trs(out,p,r,s){
  const cx=Math.cos(r[0]),sx=Math.sin(r[0]),cy=Math.cos(r[1]),sy=Math.sin(r[1]),cz=Math.cos(r[2]),sz=Math.sin(r[2]);
  out[0]=(cy*cz+sy*sx*sz)*s[0]; out[1]=(cx*sz)*s[0]; out[2]=(-sy*cz+cy*sx*sz)*s[0]; out[3]=0;
  out[4]=(-cy*sz+sy*sx*cz)*s[1]; out[5]=(cx*cz)*s[1]; out[6]=(sy*sz+cy*sx*cz)*s[1]; out[7]=0;
  out[8]=(sy*cx)*s[2]; out[9]=(-sx)*s[2]; out[10]=(cy*cx)*s[2]; out[11]=0;
  out[12]=p[0]; out[13]=p[1]; out[14]=p[2]; out[15]=1; return out;
}
function m4inv(out,m){
  const a00=m[0],a01=m[1],a02=m[2],a03=m[3],a10=m[4],a11=m[5],a12=m[6],a13=m[7],a20=m[8],a21=m[9],a22=m[10],a23=m[11],a30=m[12],a31=m[13],a32=m[14],a33=m[15];
  const b00=a00*a11-a01*a10,b01=a00*a12-a02*a10,b02=a00*a13-a03*a10,b03=a01*a12-a02*a11,b04=a01*a13-a03*a11,b05=a02*a13-a03*a12,
        b06=a20*a31-a21*a30,b07=a20*a32-a22*a30,b08=a20*a33-a23*a30,b09=a21*a32-a22*a31,b10=a21*a33-a23*a31,b11=a22*a33-a23*a32;
  let det=b00*b11-b01*b10+b02*b09+b03*b08-b04*b07+b05*b06; if(!det) return out; det=1/det;
  out[0]=(a11*b11-a12*b10+a13*b09)*det; out[1]=(a02*b10-a01*b11-a03*b09)*det; out[2]=(a31*b05-a32*b04+a33*b03)*det; out[3]=(a22*b04-a21*b05-a23*b03)*det;
  out[4]=(a12*b08-a10*b11-a13*b07)*det; out[5]=(a00*b11-a02*b08+a03*b07)*det; out[6]=(a32*b02-a30*b05-a33*b01)*det; out[7]=(a20*b05-a22*b02+a23*b01)*det;
  out[8]=(a10*b10-a11*b08+a13*b06)*det; out[9]=(a01*b08-a00*b10-a03*b06)*det; out[10]=(a30*b04-a31*b02+a33*b00)*det; out[11]=(a21*b02-a20*b04-a23*b00)*det;
  out[12]=(a11*b07-a10*b09-a12*b06)*det; out[13]=(a00*b09-a01*b07+a02*b06)*det; out[14]=(a31*b01-a30*b03-a32*b00)*det; out[15]=(a20*b03-a21*b01+a22*b00)*det;
  return out;
}
function m4persp(out,fov,asp,n,f){ out.fill(0); const t=1/Math.tan(fov/2); out[0]=t/asp; out[5]=t; out[10]=(f+n)/(n-f); out[11]=-1; out[14]=2*f*n/(n-f); return out; }

class Node{
  constructor(o={}){
    this.pos=o.pos?o.pos.slice():[0,0,0]; this.rot=o.rot?o.rot.slice():[0,0,0]; this.scl=o.scl?o.scl.slice():[1,1,1];
    this.color=o.color!==undefined?hex(o.color):[1,1,1]; this.alpha=o.alpha!==undefined?o.alpha:1; this.emissive=o.emissive||0;
    this.tex=o.tex||null; this.texFace=o.texFace!==undefined?o.texFace:5; this.mesh=!!o.mesh; this.noise=o.noise||0;
    this.visible=true; this.children=[]; this.parent=null; this.world=m4(); this.name=o.name||'';
  }
  add(...cs){ for(const c of cs){ if(c.parent) c.parent.remove(c); c.parent=this; this.children.push(c);} return this; }
  remove(c){ const i=this.children.indexOf(c); if(i>=0) this.children.splice(i,1); c.parent=null; }
  wpos(){ return [this.world[12],this.world[13],this.world[14]]; }
}
function grp(pos,rot){ return new Node({pos:pos||[0,0,0],rot:rot||[0,0,0]}); }
function box(w,h,d,color,pos,o={}){ return new Node(Object.assign({},o,{scl:[w,h,d],color:color,pos:pos||[0,0,0],mesh:true})); }

// ---------------- 粒子 ----------------
class Particles{
  constructor(max,additive){ this.max=max; this.add=additive; this.n=0;
    this.p=new Float32Array(max*3); this.v=new Float32Array(max*3); this.c=new Float32Array(max*4); this.s=new Float32Array(max);
    this.life=new Float32Array(max); this.ml=new Float32Array(max); this.g=new Float32Array(max); this.dr=new Float32Array(max); this.gr=new Float32Array(max);
    this.buf=new Float32Array(max*8); }
  emit(o){
    const cnt=o.count||1;
    for(let k=0;k<cnt;k++){
      if(this.n>=this.max) return; const i=this.n++;
      const sp=o.spread!==undefined?o.spread:1, ps=o.posSpread||0;
      this.p[i*3]=o.pos[0]+(Math.random()-.5)*ps; this.p[i*3+1]=o.pos[1]+(Math.random()-.5)*ps*(o.flat?0:1); this.p[i*3+2]=o.pos[2]+(Math.random()-.5)*ps;
      const v=o.vel||[0,0,0];
      this.v[i*3]=v[0]+(Math.random()-.5)*2*sp; this.v[i*3+1]=v[1]+(Math.random()-.5)*2*sp*(o.spreadY!==undefined?o.spreadY:1); this.v[i*3+2]=v[2]+(Math.random()-.5)*2*sp;
      const col=Array.isArray(o.color[0])?o.color[(Math.random()*o.color.length)|0]:o.color; const vr=o.colorVar||0;
      this.c[i*4]=Math.max(0,col[0]+(Math.random()-.5)*vr); this.c[i*4+1]=Math.max(0,col[1]+(Math.random()-.5)*vr); this.c[i*4+2]=Math.max(0,col[2]+(Math.random()-.5)*vr); this.c[i*4+3]=col[3]!==undefined?col[3]:1;
      this.s[i]=(o.size||0.3)*(0.6+Math.random()*0.8); const l=(o.life||1)*(0.6+Math.random()*0.8); this.life[i]=l; this.ml[i]=l;
      this.g[i]=o.gravity!==undefined?o.gravity:-9.8; this.dr[i]=o.drag||0; this.gr[i]=o.grow||0;
    }
  }
  update(dt){
    for(let i=0;i<this.n;i++){
      this.life[i]-=dt;
      if(this.life[i]<=0){ const j=--this.n; if(i!==j){ this.copy(j,i); } i--; continue; }
      const d=Math.max(0,1-this.dr[i]*dt);
      this.v[i*3]*=d; this.v[i*3+1]=this.v[i*3+1]*d+this.g[i]*dt; this.v[i*3+2]*=d;
      this.p[i*3]+=this.v[i*3]*dt; this.p[i*3+1]+=this.v[i*3+1]*dt; this.p[i*3+2]+=this.v[i*3+2]*dt;
      if(this.p[i*3+1]<0.03 && this.g[i]<0){ this.p[i*3+1]=0.03; this.v[i*3]*=0.3; this.v[i*3+1]=0; this.v[i*3+2]*=0.3; }
      this.s[i]+=this.gr[i]*dt;
    }
  }
  copy(j,i){ for(let k=0;k<3;k++){this.p[i*3+k]=this.p[j*3+k]; this.v[i*3+k]=this.v[j*3+k];} for(let k=0;k<4;k++) this.c[i*4+k]=this.c[j*4+k];
    this.s[i]=this.s[j]; this.life[i]=this.life[j]; this.ml[i]=this.ml[j]; this.g[i]=this.g[j]; this.dr[i]=this.dr[j]; this.gr[i]=this.gr[j]; }
  clear(){ this.n=0; }
  fill(){
    const b=this.buf;
    for(let i=0;i<this.n;i++){
      const k=this.life[i]/this.ml[i], fade=Math.min(1,k*2.2)*Math.min(1,(1-k)*12+0.2);
      b[i*8]=this.p[i*3]; b[i*8+1]=this.p[i*3+1]; b[i*8+2]=this.p[i*3+2]; b[i*8+3]=this.s[i];
      b[i*8+4]=this.c[i*4]; b[i*8+5]=this.c[i*4+1]; b[i*8+6]=this.c[i*4+2]; b[i*8+7]=this.c[i*4+3]*fade;
    }
    return this.n;
  }
}

// ---------------- 渲染器 ----------------
const VS=`attribute vec3 aP;attribute vec3 aN;attribute vec2 aU;attribute float aF;
uniform mat4 uM;uniform mat4 uVP;uniform vec3 uCam;
varying vec3 vN;varying vec2 vU;varying float vF;varying float vD;varying vec3 vW;
void main(){vec4 w=uM*vec4(aP,1.);vW=w.xyz;vN=normalize(mat3(uM)*aN);vU=aU;vF=aF;vD=distance(w.xyz,uCam);gl_Position=uVP*w;}`;
const FS=`precision mediump float;
varying vec3 vN;varying vec2 vU;varying float vF;varying float vD;varying vec3 vW;
uniform vec3 uColor;uniform float uAlpha;uniform float uEm;uniform sampler2D uTex;uniform float uTexFace;uniform float uNoise;
uniform vec3 uLDir;uniform vec3 uLCol;uniform vec3 uAmb;uniform vec3 uFogC;uniform vec2 uFog;
uniform vec3 uPPos;uniform vec3 uPCol;uniform float uPRange;
float h(vec3 p){return fract(sin(dot(p,vec3(12.9898,78.233,37.719)))*43758.5453);}
void main(){
 vec3 n=normalize(vN);vec3 base=uColor;float a=uAlpha;
 if(uTexFace>-0.5&&abs(vF-uTexFace)<0.5){vec4 t=texture2D(uTex,vU);base=mix(base,t.rgb,t.a);}
 if(uNoise>0.){base*=1.-uNoise*h(floor(vW*1.5));}

const Input={keys:{},mdx:0,mdy:0,look:false,move:false,touch:false,joy:[0,0],eDown:false,ePress:false,onPress:null,locked:false,tdx:0,tdy:0,
  init(){
    this.touch=('ontouchstart' in window)||(navigator.maxTouchPoints>0&&matchMedia('(pointer:coarse)').matches);
    if(this.touch) document.body.classList.add('touch');
    addEventListener('keydown',e=>{ const k=e.key.toLowerCase(); if(!this.keys[k]&&k==='e'){ this.ePress=true; } this.keys[k]=true; if(k==='e') this.eDown=true; if(k===' '&&this.onPress) this.onPress(); });
    addEventListener('keyup',e=>{ const k=e.key.toLowerCase(); this.keys[k]=false; if(k==='e') this.eDown=false; });
    addEventListener('mousemove',e=>{ if(this.locked){ this.mdx+=e.movementX||0; this.mdy+=e.movementY||0; } });
    addEventListener('pointerdown',e=>{ SFX.init(); if(e.target&&e.target.closest&&e.target.closest('#ebtn,#joy,button')) return; if(this.onPress) this.onPress(); });
    $('cv').addEventListener('click',()=>{ if(this.look&&!this.touch&&!this.locked){ try{ const r=$('cv').requestPointerLock(); if(r&&r.catch) r.catch(()=>{}); }catch(e){} } });
    document.addEventListener('pointerlockchange',()=>{ this.locked=document.pointerLockElement===$('cv'); });
    // 觸控：搖桿
    const joy=$('joy'),knob=joy.firstChild; let jid=null,jc=[0,0];
    joy.addEventListener('touchstart',e=>{ e.preventDefault(); const t=e.changedTouches[0]; jid=t.identifier; const r=joy.getBoundingClientRect(); jc=[r.left+r.width/2,r.top+r.height/2]; this.jmove(t,jc,knob); },{passive:false});
    joy.addEventListener('touchmove',e=>{ e.preventDefault(); for(const t of e.changedTouches) if(t.identifier===jid) this.jmove(t,jc,knob); },{passive:false});
    const jend=e=>{ for(const t of e.changedTouches) if(t.identifier===jid){ jid=null; this.joy=[0,0]; knob.style.left='40px'; knob.style.top='40px'; } };
    joy.addEventListener('touchend',jend); joy.addEventListener('touchcancel',jend);
    const lz=$('lookzone'); let lid=null,lp=[0,0];
    lz.addEventListener('touchstart',e=>{ e.preventDefault(); const t=e.changedTouches[0]; lid=t.identifier; lp=[t.clientX,t.clientY]; if(this.onPress) this.onPress(); },{passive:false});
    lz.addEventListener('touchmove',e=>{ e.preventDefault(); for(const t of e.changedTouches) if(t.identifier===lid){ this.tdx+=t.clientX-lp[0]; this.tdy+=t.clientY-lp[1]; lp=[t.clientX,t.clientY]; } },{passive:false});
    lz.addEventListener('touchend',e=>{ for(const t of e.changedTouches) if(t.identifier===lid) lid=null; });

  },
  jmove(t,c,knob){ let dx=t.clientX-c[0],dy=t.clientY-c[1]; const l=Math.hypot(dx,dy),m=50; if(l>m){dx*=m/l;dy*=m/l;} this.joy=[dx/m,dy/m]; knob.style.left=(40+dx)+'px'; knob.style.top=(40+dy)+'px'; },
  unlock(){ if(document.pointerLockElement){ try{ document.exitPointerLock(); }catch(e){} } },
  consumeLook(){ const r=[this.mdx*0.0024+this.tdx*0.006,this.mdy*0.0024+this.tdy*0.006]; this.mdx=this.mdy=this.tdx=this.tdy=0; return r; },
  moveVec(){ let x=0,z=0; const k=this.keys; if(k.w||k.arrowup) z-=1; if(k.s||k.arrowdown) z+=1; if(k.a||k.arrowleft) x-=1; if(k.d||k.arrowright) x+=1; x+=this.joy[0]; z+=this.joy[1]; const l=Math.hypot(x,z); if(l>1){x/=l;z/=l;} return [x,z]; }

      c.fillStyle='#1a0000'; c.beginPath(); c.moveTo(64-w,my-up); c.quadraticCurveTo(64,my+16+p*10,64+w,my-up); c.quadraticCurveTo(64,my+4+p*4,64-w,my-up); c.fill();
      if(p>0.15){ c.fillStyle='#eee'; for(let i=-4;i<=4;i++){ const x=64+i*w/5.5; c.fillRect(x-2,my+2+p*4-Math.abs(i)*p*5,4,4+p*3); } }
      if(p>0.4){ c.strokeStyle=`rgba(150,0,0,${(p-0.4)*1.6})`; c.lineWidth=3; c.beginPath(); c.moveTo(64-w,my-up); c.lineTo(64-w-6,my-up-10); c.moveTo(64+w,my-up); c.lineTo(64+w+6,my-up-10); c.stroke(); bloodS(Math.floor(p*10)); }
      break; }
  }

}
function faceTex(kind,o){ const key=kind+JSON.stringify(o||{}); if(!_faceCache[key]) _faceCache[key]=R.texFromCanvas(faceCanvas(kind,o)); return _faceCache[key]; }
function textTex(text,o){ o=o||{}; const key='T'+text+JSON.stringify(o); if(_faceCache[key]) return _faceCache[key];

function lookAngles(from,to){ const dx=to[0]-from[0],dy=to[1]-from[1],dz=to[2]-from[2]; return [Math.atan2(-dx,-dz),Math.atan2(dy,Math.hypot(dx,dz))]; }
function camSet(pos,target){ Cam.mode='script'; Cam.pos=pos.slice(); const [y,p]=lookAngles(pos,target); Cam.yaw=y; Cam.pitch=p; Cam.roll=0; }
function camTo(pos,yaw,pitch,dur,e){ Cam.mode='script'; const p0=Cam.pos.slice(),y0=Cam.yaw,q0=Cam.pitch; return tween(dur,k=>{ Cam.pos=lerp3(p0,pos,k); Cam.yaw=angLerp(y0,yaw,k); Cam.pitch=lerp(q0,pitch,k); },e||ease.io); }
function camLook(pos,target,dur,e){ const [y,p]=lookAngles(pos,target); return camTo(pos,y,p,dur,e); }
function camTrack(getTarget){ return every(()=>{ const [y,p]=lookAngles(Cam.pos,getTarget()); Cam.yaw=angLerp(Cam.yaw,y,0.12); Cam.pitch=lerp(Cam.pitch,p,0.12); }); }
